<script>
// ==================== GLOBAL STATE & CACHE ====================
let ALL_STUDENTS = [];
let ALL_USERS = [];
let CUR_STUDENT = null;
let CURRENT_USER = null;
let CACHE_STUDENTS_DETAIL = {};
let CURRENT_VIEW_MODE = localStorage.getItem('tony_view_mode') || 'card';

// Studio Classroom State
let STUDIO_SESSION_SCORE = 8;
let MEDIA_RECORDER = null;
let AUDIO_CHUNKS = [];
let RECORD_TIMER_INT = null;
let RECORD_SECONDS = 0;

const $ = function(id){ return document.getElementById(id); };

function toast(m){
  const t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2400);
}
function open_(id){ $(id).classList.add('on'); }
function close_(id){ $(id).classList.remove('on'); }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function mdBold(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }

function fmtDate(d) {
  if (!d) return '—';
  if (typeof d === 'string') {
    d = d.trim();
    if (!d) return '—';
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(d)) return d;
    if (d.indexOf('-') > 0) {
      const parts = d.split('T')[0].split('-');
      if (parts.length === 3) {
        if (parts[0].length === 4) return parts[2] + '/' + parts[1] + '/' + parts[0];
        if (parts[2].length === 4) return parts[0] + '/' + parts[1] + '/' + parts[2];
      }
    }
    const dt = new Date(d);
    if (!isNaN(dt.getTime())) {
      const day = String(dt.getDate()).padStart(2, '0');
      const mon = String(dt.getMonth() + 1).padStart(2, '0');
      const yr  = dt.getFullYear();
      return day + '/' + mon + '/' + yr;
    }
    return d;
  }
  if (d instanceof Date && !isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const mon = String(d.getMonth() + 1).padStart(2, '0');
    const yr  = d.getFullYear();
    return day + '/' + mon + '/' + yr;
  }
  return String(d);
}

// ==================== AVATAR HELPERS ====================
function getInitials(name) {
  if (!name) return 'HV';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getAvatarHtml(s, sizeClass) {
  const rank = String(s.rank || 'A').toUpperCase();
  const rkBorder = 'rk-border-' + rank;
  const cls = 'st-avatar ' + rkBorder + ' ' + (sizeClass || '');
  if (s.avatar && String(s.avatar).trim().length > 5) {
    return '<div class="' + cls + '" style="background-image:url(\'' + esc(s.avatar) + '\');background-size:cover;background-position:center;background-repeat:no-repeat;"></div>';
  }
  return '<div class="' + cls + '">' + esc(getInitials(s.hoTen)) + '</div>';
}

function updateAvatarPreview(url) {
  const box = $('avatarPreviewBox');
  if (url && String(url).trim().length > 5) {
    box.style.backgroundImage = "url('" + url + "')";
    box.style.backgroundSize = "cover";
    box.style.backgroundPosition = "center";
    box.textContent = '';
  } else {
    box.style.backgroundImage = 'none';
    box.textContent = getInitials($('f_hoTen').value);
  }
}

function updateInitialsAvatar(name) {
  if (!$('f_avatar').value) {
    const box = $('avatarPreviewBox');
    box.style.backgroundImage = 'none';
    box.textContent = getInitials(name);
  }
}

function handleAvatarFileSelect(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxSize = 220; // Nén kích thước chuẩn avatar tròn 220px siêu nhẹ (<10KB)
        let w = img.width;
        let h = img.height;
        if (w > h) {
          if (w > maxSize) {
            h = Math.round((h * maxSize) / w);
            w = maxSize;
          }
        } else {
          if (h > maxSize) {
            w = Math.round((w * maxSize) / h);
            h = maxSize;
          }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
        $('f_avatar').value = compressedDataUrl;
        updateAvatarPreview(compressedDataUrl);
        toast('✅ Đã nạp & tối ưu ảnh đại diện');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function removeAvatar() {
  $('f_avatar').value = '';
  $('f_avatar_file').value = '';
  const box = $('avatarPreviewBox');
  box.style.backgroundImage = 'none';
  box.textContent = getInitials($('f_hoTen').value);
  toast('Đã xoá ảnh đại diện');
}

// ==================== VIEW SWITCHER (CARD / GRID / TABLE) ====================
function switchStudentView(mode) {
  CURRENT_VIEW_MODE = mode;
  localStorage.setItem('tony_view_mode', mode);

  $('btnViewCard').classList.toggle('active', mode === 'card');
  $('btnViewGrid').classList.toggle('active', mode === 'grid');
  $('btnViewTable').classList.toggle('active', mode === 'table');

  $('studentCardsContainer').style.display = mode === 'card' ? 'grid' : 'none';
  $('studentGridContainer').style.display  = mode === 'grid' ? 'grid' : 'none';
  $('studentTableContainer').style.display = mode === 'table' ? 'block' : 'none';

  renderStudents();
}

// ==================== ĐIỀU HƯỚNG TỔNG QUAN ====================
const MAIN_VIEW_IDS = ['dashboard', 'schedule', 'students', 'trial', 'tuition', 'settings', 'student-profile', 'classroom-flow'];

function showOnlyView(name) {
  MAIN_VIEW_IDS.forEach(function(v){
    const el = $('view-' + v);
    if (el) el.style.display = (v === name) ? 'block' : 'none';
  });
}

function navigateTo(v) {
  const a = document.querySelector('.nav a[data-view="' + v + '"]');
  if (a) a.onclick();
}

document.querySelectorAll('.nav a').forEach(function(a){
  a.onclick = function(){
    const v = a.dataset.view;
    if (v === 'settings' && !hasPerm('settings', 'view')) {
      toast('⚠️ Bạn không có quyền truy cập mục Cấu hình');
      return;
    }
    if (v === 'tuition' && !isAdmin()) {
      toast('⚠️ Chỉ Admin mới xem được Học phí & Quyết toán');
      return;
    }
    document.querySelectorAll('.nav a').forEach(function(x){ x.classList.remove('active'); });
    a.classList.add('active');

    showOnlyView(v);
    $('mainSidebar').style.display          = 'flex';
    document.body.style.paddingLeft         = '240px';

    if (v === 'dashboard') loadDashboard();
    if (v === 'students')  loadStudents();
    if (v === 'trial')     loadStudents();
    if (v === 'schedule')  { if (!SCHEDULE_DATA) loadScheduleSheet(); }
    if (v === 'tuition')   loadTuitionSettlement();
    if (v === 'settings')  loadSettingsView();
  };
});

// Profile Tabs
document.querySelectorAll('.profile-header-bar + .profile-hero + .profile-quick-info + .tabs button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.profile-header-bar + .profile-hero + .profile-quick-info + .tabs button').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    document.querySelectorAll('.ptabpane').forEach(function(p){ p.style.display = 'none'; });
    $('ptab-' + b.dataset.ptab).style.display = 'block';
    if (b.dataset.ptab === 'pprog' && CUR_STUDENT) renderProgressCharts(CUR_STUDENT.buoiHoc || []);
  };
});

// ==================== PHÂN QUYỀN ====================
function hasPerm(module, act) {
  if (!CURRENT_USER) return true;
  if (CURRENT_USER.role === 'admin') return true;
  const p = CURRENT_USER.permissions || {};
  if (p[module] && p[module][act]) return true;
  return false;
}

function isAdmin() {
  return !!(CURRENT_USER && CURRENT_USER.role === 'admin');
}

function updateUiByPermissions() {
  document.body.classList.toggle('is-admin', isAdmin());
  if (!isAdmin() && $('view-tuition') && $('view-tuition').style.display === 'block') navigateTo('dashboard');
  const canAddSt = hasPerm('students', 'edit');
  if ($('btnAddNewStudent')) $('btnAddNewStudent').style.display = canAddSt ? 'inline-flex' : 'none';
  const canDeleteSt = hasPerm('students', 'delete');
  if ($('btnDeleteStProfile')) $('btnDeleteStProfile').style.display = canDeleteSt ? 'inline-flex' : 'none';
  if ($('btnDeleteSelectedStudents')) $('btnDeleteSelectedStudents').style.display = canDeleteSt ? 'inline-flex' : 'none';
}

function switchCurrentUser() {
  const selId = $('curUserSelect').value;
  CURRENT_USER = ALL_USERS.find(function(u){ return String(u.id) === String(selId); }) || ALL_USERS[0];
  if (CURRENT_USER) {
    $('curUserRoleBadge').textContent = (CURRENT_USER.role === 'admin' ? 'Admin' : 'Giảng viên') + ' · ' + CURRENT_USER.hoTen;
    updateUiByPermissions();
    toast('Đã chuyển sang tài khoản: ' + CURRENT_USER.hoTen);
  }
}

// ==================== DASHBOARD ====================
function loadDashboard(){
  google.script.run.withSuccessHandler(function(d){
    const cards = [
      ['g', d.tong, 'Tổng học viên'],
      ['t', d.dangHoc, 'Đang học'],
      ['o', d.hoanThanh, 'Đã hoàn thành'],
      ['r', d.nghi, 'Đã nghỉ'],
      ['m', d.hocThu, 'Học thử']
    ];
    $('statCards').innerHTML = cards.map(function(c){
      return '<div class="stat ' + c[0] + '"><span class="bar"></span><div class="n">' + c[1] + '</div><div class="l">' + c[2] + '</div></div>';
    }).join('');
    const rc = { A:'#C5A059', B:'#34D399', C:'#6bb0e0', D:'#b78fe0' };
    $('rankChart').innerHTML = barChart(d.byRank, rc);
    $('lopChart').innerHTML  = barChart(d.byLop, null);
  }).getDashboard();
}

function barChart(obj, colors){
  const keys = Object.keys(obj);
  if (!keys.length) return '<div class="empty">Chưa có dữ liệu</div>';
  const max = Math.max.apply(null, keys.map(function(k){ return obj[k]; })) || 1;
  const pal = ['#3A5A42', '#4d7358', '#C5A059', '#34D399', '#6bb0e0', '#b78fe0'];
  return keys.map(function(k, i){
    const col = colors ? (colors[k] || pal[i % pal.length]) : pal[i % pal.length];
    const w = Math.max(8, Math.round(obj[k] / max * 100));
    return '<div class="brow"><div class="k">' + esc(k) + '</div><div class="track">' +
      '<div class="fill" style="width:' + w + '%;background:' + col + '">' + obj[k] + '</div></div></div>';
  }).join('');
}

// ==================== HỌC VIÊN: DANH SÁCH ====================
function loadStudents(){
  google.script.run.withSuccessHandler(function(list){
    ALL_STUDENTS = list || [];
    renderStudents();
    renderTrialList();
  }).getStudents();
}

// HV học thử / chờ phản hồi / từ chối → chỉ hiện ở tab Học thử
function isTrialStudent(s) {
  const ts = String(s.trialStatus || '').trim();
  if (ts) return ts !== 'confirmed';
  const st = String(s.tinhTrang || '');
  return st.indexOf('thử') >= 0 || st.indexOf('Chờ phản hồi') >= 0 || st.indexOf('Từ chối') >= 0;
}

function getOfficialStudents() {
  return ALL_STUDENTS.filter(function(s){ return !isTrialStudent(s); });
}

function stBadge(st){
  st = String(st || '');
  let c = 'st-thu';
  if (st.indexOf('Đang') >= 0) c = 'st-hoc';
  else if (st.indexOf('hoàn thành') >= 0) c = 'st-done';
  else if (st.indexOf('nghỉ') >= 0 || st.indexOf('Nghỉ') >= 0) c = 'st-nghi';
  return '<span class="badge ' + c + '">' + esc(st) + '</span>';
}

function renderStudents(){
  const q = ($('search').value || '').toLowerCase();
  const rkFilter = $('filterRank').value;

  const official = getOfficialStudents();
  const list = official.filter(function(s){
    const matchQ = (String(s.hoTen) + ' ' + String(s.lop) + ' ' + String(s.giaoVien) + ' ' + String(s.loaiGiong)).toLowerCase().indexOf(q) >= 0;
    const matchRk = !rkFilter || String(s.rank).toUpperCase() === rkFilter.toUpperCase();
    return matchQ && matchRk;
  });

  $('stCount').textContent = official.length + ' học viên · hiện ' + list.length;
  $('stEmpty').style.display = list.length ? 'none' : 'block';

  if (CURRENT_VIEW_MODE === 'card') {
    renderCardsView(list);
  } else if (CURRENT_VIEW_MODE === 'grid') {
    renderGridView(list);
  } else {
    renderTableView(list);
  }
  updateSelectedStudentCount();
}

function renderCardsView(list) {
  const canDelete = hasPerm('students', 'delete');
  $('studentCardsContainer').innerHTML = list.map(function(s){
    const rk = s.rank || 'A';
    const total = parseInt(s.soBuoiKhoa || s.soBuoiDeal, 10) || 12;
    const done = parseInt(s.soBuoiDaHoc, 10) || 0;
    const pct = Math.min(100, Math.round((done / Math.max(total, 1)) * 100));
    const left = s.soBuoiConLai != null ? s.soBuoiConLai : Math.max(0, total - done);

    let alertTag = '';
    let renewAction = '';
    if (left <= 0) {
      alertTag = '<span class="badge-danger-pulse">🚨 Hết buổi</span>';
      renewAction = '<button class="btn-renew" style="padding:4px 10px;font-size:11.5px" onclick="event.stopPropagation();openRenewModal(\'' + s.id + '\')">⚡ Gia hạn</button>';
    } else if (left === 1) {
      alertTag = '<span class="badge-warning-pulse">⚠️ Còn 1 buổi</span>';
      renewAction = '<button class="btn-renew" style="padding:4px 10px;font-size:11.5px" onclick="event.stopPropagation();openRenewModal(\'' + s.id + '\')">⚡ Gia hạn</button>';
    }

    const driveBtn = s.linkDrive && s.linkDrive.indexOf('http') === 0
      ? '<a href="' + esc(s.linkDrive) + '" target="_blank" onclick="event.stopPropagation()" class="btn sm ghost" style="padding:3px 8px;font-size:11px">📁 Drive</a>'
      : '';

    const deleteBtnHtml = canDelete
      ? '<button class="btn sm ghost danger" title="Xoá học viên" onclick="event.stopPropagation();deleteSingleStudent(\'' + s.id + '\',\'' + esc(s.hoTen) + '\')">🗑 Xoá</button>'
      : '';

    return '<div class="st-card" style="position:relative" onclick="openStudentProfile(\'' + s.id + '\')">' +
      '<div class="st-card-chk-wrap">' +
        '<input type="checkbox" class="st-chk" value="' + s.id + '" onchange="updateSelectedStudentCount()" onclick="event.stopPropagation()">' +
      '</div>' +
      '<div>' +
        '<div class="st-card-header" style="padding-left:24px">' +
          '<div class="st-avatar-wrap">' +
            getAvatarHtml(s) +
            '<span class="badge rk-' + rk + ' st-rank-badge-floated">Rank ' + rk + '</span>' +
          '</div>' +
          '<div class="st-card-info">' +
            '<h3>' + esc(s.hoTen) + '</h3>' +
            '<p>' + esc(s.loaiGiong || 'Chưa chọn giọng') + ' · Lớp <b>' + esc(s.lop || '—') + '</b></p>' +
            '<div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + 
              stBadge(s.tinhTrang) + 
              alertTag +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="st-progress-box">' +
          '<div class="st-prog-header">' +
            '<span>Tiến độ: <b>' + done + '/' + total + ' buổi</b></span>' +
            (left <= 1 ? (left <= 0 ? '<b style="color:var(--danger)">Hết buổi</b>' : '<b style="color:var(--warn)">Còn đúng 1 buổi</b>') : '<span style="color:var(--gold)">Còn ' + left + ' buổi</span>') +
          '</div>' +
          '<div class="st-prog-bar"><div class="st-prog-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +

        '<div class="st-tags">' +
          (s.quangGiong ? '<span class="st-tag">🎙 ' + esc(s.quangGiong) + '</span>' : '') +
          (s.noteChuyenGiong ? '<span class="st-tag">⚡ ' + esc(s.noteChuyenGiong) + '</span>' : '') +
          '<span class="st-tag">👨‍🏫 GV ' + esc(s.giaoVien || 'Linh') + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="st-card-actions">' +
        '<span style="color:var(--mut);font-size:11.5px">Bắt đầu: <b>' + fmtDate(s.ngayBatDau) + '</b></span>' +
        '<div class="row-flex" style="gap:6px">' +
          renewAction +
          driveBtn +
          '<button class="btn sm ghost" onclick="event.stopPropagation();openStudentModalFast(\'' + s.id + '\')">✏ Sửa</button>' +
          deleteBtnHtml +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderGridView(list) {
  const canDelete = hasPerm('students', 'delete');
  $('studentGridContainer').innerHTML = list.map(function(s){
    const rk = s.rank || 'A';
    const total = parseInt(s.soBuoiKhoa || s.soBuoiDeal, 10) || 12;
    const done = parseInt(s.soBuoiDaHoc, 10) || 0;
    const pct = Math.min(100, Math.round((done / Math.max(total, 1)) * 100));
    const left = s.soBuoiConLai != null ? s.soBuoiConLai : Math.max(0, total - done);

    let alertTag = '';
    if (left <= 0) {
      alertTag = '<div style="margin-top:4px"><span class="badge-danger-pulse">🚨 Hết buổi</span></div>';
    } else if (left === 1) {
      alertTag = '<div style="margin-top:4px"><span class="badge-warning-pulse">⚠️ Còn 1 buổi</span></div>';
    }

    const deleteBtnHtml = canDelete
      ? '<button class="btn sm ghost danger" style="padding:2px 6px;font-size:11px;margin-top:6px" title="Xoá học viên" onclick="event.stopPropagation();deleteSingleStudent(\'' + s.id + '\',\'' + esc(s.hoTen) + '\')">🗑 Xoá</button>'
      : '';

    return '<div class="st-grid-item" style="position:relative" onclick="openStudentProfile(\'' + s.id + '\')">' +
      '<div class="st-card-chk-wrap">' +
        '<input type="checkbox" class="st-chk" value="' + s.id + '" onchange="updateSelectedStudentCount()" onclick="event.stopPropagation()">' +
      '</div>' +
      getAvatarHtml(s) +
      '<h4>' + esc(s.hoTen) + '</h4>' +
      '<p style="font-size:12px;color:var(--mut);margin-bottom:8px">Lớp ' + esc(s.lop || '—') + ' · <span class="badge rk-' + rk + '">' + rk + '</span></p>' +
      '<div class="st-prog-bar" style="margin-bottom:6px"><div class="st-prog-fill" style="width:' + pct + '%"></div></div>' +
      '<small style="color:var(--mut);font-size:11px">' + done + '/' + total + ' buổi (còn ' + left + ')' + '</small>' +
      alertTag +
      deleteBtnHtml +
    '</div>';
  }).join('');
}

function renderTableView(list) {
  const canDelete = hasPerm('students', 'delete');
  $('stBody').innerHTML = list.map(function(s){
    const rk = s.rank ? '<span class="badge rk-' + s.rank + '">' + s.rank + '</span>' : '—';
    const total = parseInt(s.soBuoiKhoa || s.soBuoiDeal, 10) || 12;
    const done = parseInt(s.soBuoiDaHoc, 10) || 0;
    const left = s.soBuoiConLai != null ? s.soBuoiConLai : Math.max(0, total - done);

    let sessionCell = '<b>' + done + '</b> / ' + total;
    if (left <= 0) {
      sessionCell += ' <span class="badge-danger-pulse" style="margin-left:4px">🚨 Hết</span> <button class="btn-renew" style="padding:2px 7px;font-size:11px;margin-left:4px" onclick="event.stopPropagation();openRenewModal(\'' + s.id + '\')">⚡ Gia hạn</button>';
    } else if (left === 1) {
      sessionCell += ' <span class="badge-warning-pulse" style="margin-left:4px">⚠️ Còn 1</span> <button class="btn-renew" style="padding:2px 7px;font-size:11px;margin-left:4px" onclick="event.stopPropagation();openRenewModal(\'' + s.id + '\')">⚡ Gia hạn</button>';
    } else {
      sessionCell += ' <small style="color:var(--mut)">(còn ' + left + ')</small>';
    }

    const driveLink = s.linkDrive && s.linkDrive.indexOf('http') === 0
      ? '<a href="' + esc(s.linkDrive) + '" target="_blank" onclick="event.stopPropagation()" class="pill-note" style="color:var(--teal)">📁 Mở Drive</a>'
      : '<span style="color:#55695d">—</span>';
    
    const actionBtnsHtml = '<div class="row-flex" style="gap:4px;justify-content:flex-end">' +
      '<button class="btn sm ghost" title="Sửa" onclick="event.stopPropagation();openStudentModalFast(\'' + s.id + '\')">✏ Sửa</button>' +
      (canDelete ? '<button class="btn sm ghost danger" title="Xoá" onclick="event.stopPropagation();deleteSingleStudent(\'' + s.id + '\',\'' + esc(s.hoTen) + '\')">🗑 Xoá</button>' : '') +
      '</div>';

    return '<tr onclick="openStudentProfile(\'' + s.id + '\')">' +
      '<td style="text-align:center"><input type="checkbox" class="st-chk" value="' + s.id + '" onchange="updateSelectedStudentCount()" onclick="event.stopPropagation()"></td>' +
      '<td>' + getAvatarHtml(s, 'sm-avatar') + '</td>' +
      '<td><b>' + esc(s.hoTen) + '</b></td>' +
      '<td>' + esc(s.loaiGiong || '—') + '</td>' +
      '<td>' + esc(s.lop || '—') + '</td>' +
      '<td>' + rk + '</td>' +
      '<td>' + stBadge(s.tinhTrang) + '</td>' +
      '<td>' + esc(s.giaoVien || '—') + '</td>' +
      '<td>' + sessionCell + '</td>' +
      '<td>' + driveLink + '</td>' +
      '<td style="text-align:right">' + actionBtnsHtml + '</td>' +
      '</tr>';
  }).join('');
}

// ==================== THAO TÁC XOÁ & CHỌN HÀNG LOẠT HỌC VIÊN ====================
function updateSelectedStudentCount() {
  const checkedChks = document.querySelectorAll('.st-chk:checked:not(#chkAllStudents):not(#chkAllStudentsTable)');
  const count = checkedChks.length;

  // Cập nhật giao diện thẻ / lưới / bảng tương ứng với các mục được chọn
  document.querySelectorAll('.st-card').forEach(function(card){
    const chk = card.querySelector('.st-chk');
    card.classList.toggle('selected', !!(chk && chk.checked));
  });
  document.querySelectorAll('.st-grid-item').forEach(function(item){
    const chk = item.querySelector('.st-chk');
    item.classList.toggle('selected', !!(chk && chk.checked));
  });
  document.querySelectorAll('#stBody tr').forEach(function(row){
    const chk = row.querySelector('.st-chk');
    row.classList.toggle('st-row-selected', !!(chk && chk.checked));
  });

  // Hiển thị / ẩn thanh Batch Action Bar
  const batchBar = $('stBatchBar');
  const badge = $('stSelectedCountBadge');
  const btnDeleteBatch = $('btnDeleteSelectedStudents');
  const canDelete = hasPerm('students', 'delete');

  if (batchBar) {
    batchBar.style.display = count > 0 ? 'flex' : 'none';
  }
  if (badge) {
    badge.textContent = 'Đã chọn ' + count + ' học viên';

  if (btnDeleteBatch) {
    btnDeleteBatch.style.display = canDelete ? 'inline-flex' : 'none';

  // Cập nhật trạng thái Checkbox Chọn tất cả (Master Checkboxes)
  const allVisibleChks = document.querySelectorAll('.st-chk:not(#chkAllStudents):not(#chkAllStudentsTable)');
  const allChecked = allVisibleChks.length > 0 && (count === allVisibleChks.length);
  const masterChk1 = $('chkAllStudents');
  const masterChk2 = $('chkAllStudentsTable');
  if (masterChk1) masterChk1.checked = allChecked;
  if (masterChk2) masterChk2.checked = allChecked;
}

function deleteCurrentStudentFromProfile() {

  }

  executeDeleteStudents([CUR_STUDENT.id], true);

function executeDeleteStudents(studentIds, isFromProfile) {
  if (!studentIds || !studentIds.length) return;

  const idStrs = studentIds.map(function(id){ return String(id); });
  
  // 1. Optimistic UI update: Gỡ ngay học viên khỏi ALL_STUDENTS
  const backupList = ALL_STUDENTS.slice();
  ALL_STUDENTS = ALL_STUDENTS.filter(function(s){
    return idStrs.indexOf(String(s.id)) === -1;
  });

  // Xoá cache chi tiết
  idStrs.forEach(function(id){
    delete CACHE_STUDENTS_DETAIL[id];
  });

  // Nếu xoá từ Profile -> Quay lại danh sách
  if (isFromProfile) {
    goBackToStudentList();
  } else {
    renderStudents();
    renderTrialList();
  }

  toast('⚡ Đang xoá học viên trên Google Sheets...');

  // Gọi server xoá dữ liệu vĩnh viễn trên Google Sheets
  google.script.run
    .withSuccessHandler(function(res){
      if (res && res.success) {
        const count = res.count !== undefined ? res.count : studentIds.length;
        toast('🎉 Đã xoá thành công ' + count + ' học viên và dữ liệu liên quan!');
        clearSelectedStudents();
        loadDashboard(); // Cập nhật lại các thẻ thống kê Dashboard
      } else {
        // Rollback nếu có lỗi
        ALL_STUDENTS = backupList;
        renderStudents();
        toast('⚠️ Lỗi khi xoá: ' + (res ? res.message : 'Không xác định'));
      }
    })
    .withFailureHandler(function(err){
      // Rollback nếu lỗi kết nối
      ALL_STUDENTS = backupList;
      renderStudents();
      toast('❌ Lỗi hệ thống: ' + (err ? err.message : 'Không thể kết nối máy chủ'));
    })
    .deleteStudents(studentIds);
}

function openStudentProfile(id) {
  // Lấy dữ liệu nhanh
  const fastData = CACHE_STUDENTS_DETAIL[id] || ALL_STUDENTS.find(function(x){ return String(x.id) === String(id); });
  if (!fastData) { toast('Không tìm thấy học viên'); return; }

  CUR_STUDENT = fastData;
  displayStudentProfileView(CUR_STUDENT);

  // Ẩn tất cả view khác, hiện view-student-profile
  showOnlyView('student-profile');
  window.scrollTo(0,0);

  // Gọi server nạp chi tiết ngầm
  google.script.run.withSuccessHandler(function(fullData){
    if (fullData) {
      CACHE_STUDENTS_DETAIL[id] = fullData;
      if (CUR_STUDENT && String(CUR_STUDENT.id) === String(id)) {
        CUR_STUDENT = fullData;
        displayStudentProfileView(CUR_STUDENT);
      }
    }
  }).getStudent(id);
}

let EDITING_SESSION_ID = null;

function renderProfileSessions(list) {
  const container = $('profSessionList');
  const chkAll = $('chkSelectAllSessions');
  if (chkAll) { chkAll.checked = false; }
  updateSelectedSessionCount();

  if (!list || !list.length) { 
    container.innerHTML = '<div class="empty">Chưa có buổi học nào được ghi nhận.</div>'; 
    if ($('lblSelectAllSessions')) $('lblSelectAllSessions').style.display = 'none';
    return; 
  }
  if ($('lblSelectAllSessions')) $('lblSelectAllSessions').style.display = 'inline-flex';

  const driveLink = (CUR_STUDENT && CUR_STUDENT.linkDrive && CUR_STUDENT.linkDrive.indexOf('http') === 0) ? CUR_STUDENT.linkDrive : '';

  container.innerHTML = list.slice().reverse().map(function(b){
    // Xử lý danh sách bài hát
    let songsList = [];
    if (b.songsJson) {
      try {
        const parsed = typeof b.songsJson === 'string' ? JSON.parse(b.songsJson) : b.songsJson;
        if (Array.isArray(parsed) && parsed.length > 0) songsList = parsed;
      } catch(e) {}
    }
    if (!songsList.length && b.baiHat) {
      songsList = [{
        title: b.baiHat,
        ytLink: b.linkYoutube || ((b.baiHat.indexOf('http') === 0) ? b.baiHat : ''),
        noteCao: b.noteCao || '',
        noteThap: b.noteThap || '',
        details: b.noiDung || ''
      }];
    }

    let songsHtml = '';
    if (songsList.length > 0) {
      songsHtml = songsList.filter(function(s){ return s.title || s.ytLink; }).map(function(s, idx){
        let sYtBtn = '';
        if (s.ytLink && s.ytLink.indexOf('http') === 0) {
          sYtBtn = '<a href="' + esc(s.ytLink) + '" target="_blank" onclick="event.stopPropagation()" class="yt-pill-btn sm">▶ Xem YouTube</a>';
        }
        return '<div style="font-size:13.5px;font-weight:600;margin:4px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span>🎵 ' + esc(s.title || 'Bài hát ' + (idx+1)) + (s.noteCao ? ' <small style="color:var(--mut)">(Cao: ' + esc(s.noteCao) + ', Thấp: ' + esc(s.noteThap) + ')</small>' : '') + '</span>' +

          (s.details ? '<span style="color:var(--mut);font-weight:400;font-size:12px">(' + esc(s.details) + ')</span>' : '') +
        '</div>';
      }).join('');
    }

    // Xử lý danh sách kỹ thuật
    let techsList = [];
    if (b.techsJson) {
      try {
        const parsed = typeof b.techsJson === 'string' ? JSON.parse(b.techsJson) : b.techsJson;

      } catch(e) {}
    }

        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px">' +
          driveBtn +
          '<span class="badge" style="background:#2b543b;color:#fff">▶ Mở lại trong Studio</span>' +

          (b.totalScore
            ? '<span class="grade-badge grade-' + (b.sessionGrade || 'none') + '">' + b.totalScore + '/24' + (b.sessionGrade ? ' · ' + b.sessionGrade : '') + '</span>'
            : (b.diemSo ? '<span class="badge" style="background:#3a2f1a;color:var(--gold)">Điểm: ' + b.diemSo + '/10</span>' : '')) +
          '<button class="btn sm danger" style="padding:2px 8px;font-size:12px" title="Xoá buổi học này" onclick="event.stopPropagation();deleteSingleSession(\'' + (b.id||'') + '\', \'' + (b.buoiSo||'') + '\')">🗑 Xoá</button>' +
        '</div>' +
      '</div>' +
      songsHtml +
      techsHtml +
      (b.noiDung && !songsHtml ? '<div style="margin-top:4px;color:#cfe5d6"><b>Lưu ý:</b> ' + esc(b.noiDung) + '</div>' : '') +
      guideSectionsHtml +
      (b.nhanXet ? '<div style="margin-top:5px;color:var(--teal)"><b>GV nhận xét:</b> ' + esc(b.nhanXet) + '</div>' : '') +
      (b.baiTapVeNha ? '<div style="margin-top:4px;color:var(--gold)"><b>BTVN:</b> ' + esc(b.baiTapVeNha) + '</div>' : '') +

  }).join('');

  }
  const label = buoiSo ? ('Buổi ' + buoiSo) : sessionId;
  if (!confirm('Bạn có chắc chắn muốn xoá lịch sử ' + label + ' không?\n(Dữ liệu buổi học và số buổi đã học sẽ được cập nhật lại)')) {
    return;
  }
  executeDeleteSessions([sessionId]);
}

function deleteSelectedSessions() {
  const checked = document.querySelectorAll('.sess-chk:checked');
  const ids = Array.from(checked).map(function(c){ return c.value; }).filter(Boolean);
  if (!ids.length) {
    toast('⚠️ Chưa chọn buổi học nào để xoá');
    return;
  }
  if (!confirm('Bạn có chắc chắn muốn xoá ' + ids.length + ' buổi học đã chọn không?')) {
    return;
  }
  executeDeleteSessions(ids);
}

function executeDeleteSessions(sessionIds) {
  if (!CUR_STUDENT || !CUR_STUDENT.id) {
    toast('⚠️ Không xác định được học viên');
    return;
  }

  // 1. Optimistic UI update: Gỡ ngay lập tức các buổi học trên giao diện (Tốc độ tức thì)
  const idStrs = sessionIds.map(function(id){ return String(id); });
  const backupSessions = CUR_STUDENT.buoiHoc ? CUR_STUDENT.buoiHoc.slice() : [];
  CUR_STUDENT.buoiHoc = backupSessions.filter(function(b){
    return idStrs.indexOf(String(b.id)) === -1;
  });
  
  // Render lại ngay các tab
  renderProfileSessions(CUR_STUDENT.buoiHoc);
  renderProfileExercises(CUR_STUDENT.buoiHoc);
  renderProfileSongs(CUR_STUDENT.phanTichBai || []);
  
  // Cập nhật ngay các thẻ số buổi
  const total = parseInt(CUR_STUDENT.soBuoiKhoa || CUR_STUDENT.soBuoiDeal, 10) || 0;
  const done = CUR_STUDENT.buoiHoc.length;
  const left = Math.max(0, total - done);
  if ($('p_dahoc')) $('p_dahoc').textContent = done + ' buổi';
  if ($('p_conlai_num')) $('p_conlai_num').textContent = left + ' buổi';
  if ($('pq_conlai')) $('pq_conlai').textContent = left + ' buổi';

  toast('⚡ Đang tự động xoá trên Google Sheets...');

  google.script.run
    .withSuccessHandler(function(res){
      if (res && res.success) {
        toast('🎉 Đã xoá sạch hàng trên Google Sheets (' + (res.count !== undefined ? res.count : sessionIds.length) + ' buổi)!');
        delete CACHE_STUDENTS_DETAIL[CUR_STUDENT.id];
        loadStudents();
      } else {
        // Rollback nếu thất bại
        CUR_STUDENT.buoiHoc = backupSessions;
        renderProfileSessions(CUR_STUDENT.buoiHoc);
        renderProfileExercises(CUR_STUDENT.buoiHoc);
        toast('⚠️ Lỗi khi xoá: ' + (res ? res.message : 'Không xác định'));
      }
    })
    .withFailureHandler(function(err){
      CUR_STUDENT.buoiHoc = backupSessions;
      renderProfileSessions(CUR_STUDENT.buoiHoc);
      renderProfileExercises(CUR_STUDENT.buoiHoc);
      toast('❌ Lỗi hệ thống: ' + (err ? err.message : 'Không thể kết nối máy chủ'));
    })
    .deleteSessions(sessionIds, CUR_STUDENT.id);
}

// ==================== DYNAMIC MULTI-SONG MANAGEMENT & PER-SONG GUIDES ====================
let STUDIO_SONGS = [];
let ACTIVE_SONG_GUIDE_INDEX = 0;
let CURRENT_SONG_SECTIONS = [];

function getDefaultSongStructure() {
  return [
    { id: 'sec_1', title: 'Ver 1', badge: 'badge-ver', text: '' },
    { id: 'sec_2', title: 'Ver 2', badge: 'badge-ver', text: '' },
    { id: 'sec_3', title: 'Chorus', badge: 'badge-chorus', text: '' },
    { id: 'sec_4', title: 'Giang tấu', badge: 'badge-interlude', text: '' },
    { id: 'sec_5', title: 'Ver 2', badge: 'badge-ver', text: '' },
    { id: 'sec_6', title: 'Chorus', badge: 'badge-chorus', text: '' },
    { id: 'sec_7', title: 'Chorus', badge: 'badge-chorus-climax', text: '' },
    { id: 'sec_8', title: '2 câu cuối Chorus', badge: 'badge-ending', text: '' }
  ];
}

function getStudentRangeInfo() {
  if (!CUR_STUDENT) return { low: '—', high: '—', text: 'Chưa có thông tin' };
  let low = CUR_STUDENT.noteThap || '';
  let high = CUR_STUDENT.noteCao || '';
  if (!low && CUR_STUDENT.chestVoice) {
    const parts = String(CUR_STUDENT.chestVoice).split(/[-–—]/);
    if (parts[0]) low = parts[0].trim();
  }
  if (!high && (CUR_STUDENT.whistleVoice || CUR_STUDENT.headVoice || CUR_STUDENT.mixVoice)) {
    const src = (CUR_STUDENT.whistleVoice && CUR_STUDENT.whistleVoice !== '—') ? CUR_STUDENT.whistleVoice
      : ((CUR_STUDENT.headVoice && CUR_STUDENT.headVoice !== '—') ? CUR_STUDENT.headVoice : CUR_STUDENT.mixVoice);
    const parts = String(src).split(/[-–—]/);
    if (parts.length > 1) high = parts[parts.length - 1].trim();
  }
  if (!low && CUR_STUDENT.quangGiong) {
    const parts = String(CUR_STUDENT.quangGiong).split(/[-–—]/);
    if (parts[0]) low = parts[0].trim();
    if (parts.length > 1) high = parts[parts.length - 1].trim();
  }
  low = low || '—';
  high = high || '—';
  const text = (low !== '—' && high !== '—') ? (low + ' – ' + high) : (CUR_STUDENT.quangGiong || '—');
  return { low: low, high: high, text: text };
}

function syncActiveSongGuideFromDom() {
  const guideItems = document.querySelectorAll('#cf_songGuideBuilder .guide-sec-item');
  guideItems.forEach(function(item, idx){
    if (CURRENT_SONG_SECTIONS[idx]) {
      const ta = item.querySelector('textarea');
      if (ta) CURRENT_SONG_SECTIONS[idx].text = ta.value;
    }
  });
  if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
    STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = JSON.parse(JSON.stringify(CURRENT_SONG_SECTIONS));
  }
}

function switchActiveSongGuide(targetIdx) {
  if (targetIdx < 0 || targetIdx >= STUDIO_SONGS.length) return;
  syncActiveSongGuideFromDom();
  ACTIVE_SONG_GUIDE_INDEX = targetIdx;
  if (!STUDIO_SONGS[targetIdx].guideSections || !Array.isArray(STUDIO_SONGS[targetIdx].guideSections) || !STUDIO_SONGS[targetIdx].guideSections.length) {
    STUDIO_SONGS[targetIdx].guideSections = getDefaultSongStructure();
  }
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[targetIdx].guideSections;
  renderSongGuideTabs();
  renderSongGuideBuilder();
  renderStudioSongsList();
}

function renderSongGuideTabs() {
  const container = $('cf_songGuideTabsContainer');
  if (!container) return;
  if (!STUDIO_SONGS.length) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = STUDIO_SONGS.map(function(s, idx){
    const isActive = (idx === ACTIVE_SONG_GUIDE_INDEX);
    const title = s.title && s.title.trim() ? s.title.trim() : ('Bài ' + (idx + 1));
    return '<button type="button" class="btn-song-tab ' + (isActive ? 'active' : '') + '" onclick="switchActiveSongGuide(' + idx + ')">' +
      '<span>🎵 ' + esc(title) + '</span>' +
      (isActive ? '<span class="tab-badge">Đang soạn</span>' : '') +
    '</button>';
  }).join('');
}

function addStudioSongItem(data) {
  syncActiveSongGuideFromDom();

  const s = data || {
    id: 'song_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    title: '',
    ytLink: '',
    noteCao: '',
    noteThap: '',
    tone: '0',
    details: '',
    guideSections: getDefaultSongStructure()
  };
  if (!s.guideSections || !Array.isArray(s.guideSections) || !s.guideSections.length) {
    s.guideSections = getDefaultSongStructure();
  }
  if (s.tone === undefined) s.tone = '0';

  STUDIO_SONGS.push(s);
  ACTIVE_SONG_GUIDE_INDEX = STUDIO_SONGS.length - 1;
  CURRENT_SONG_SECTIONS = s.guideSections;

  renderStudioSongsList();
  renderSongGuideTabs();
  renderSongGuideBuilder();
}

function removeStudioSongItem(idx) {
  if (STUDIO_SONGS.length <= 1) {
    STUDIO_SONGS[0] = {
      id: 'song_' + Date.now(),
      title: '',
      ytLink: '',
      noteCao: '',
      noteThap: '',
      tone: '0',
      details: '',
      guideSections: getDefaultSongStructure()
    };
    ACTIVE_SONG_GUIDE_INDEX = 0;
    CURRENT_SONG_SECTIONS = STUDIO_SONGS[0].guideSections;
    renderStudioSongsList();
    renderSongGuideTabs();
    renderSongGuideBuilder();
    return;
  }
  STUDIO_SONGS.splice(idx, 1);
  if (ACTIVE_SONG_GUIDE_INDEX >= STUDIO_SONGS.length) {
    ACTIVE_SONG_GUIDE_INDEX = STUDIO_SONGS.length - 1;
  }
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections || getDefaultSongStructure();
  renderStudioSongsList();
  renderSongGuideTabs();
  renderSongGuideBuilder();
}

  if (STUDIO_SONGS[idx]) {
    STUDIO_SONGS[idx][field] = val;

      const titleEl = $('cf_song_card_title_' + idx);

    }
  }
}

function quickShiftTone(idx, delta) {
  if (!STUDIO_SONGS[idx]) return;
  let cur = parseFloat(STUDIO_SONGS[idx].tone) || 0;
  if (delta === 0) cur = 0;
  else cur += delta;
  let valStr = cur === 0 ? '0' : (cur > 0 ? ('+' + cur) : String(cur));
  STUDIO_SONGS[idx].tone = valStr;
  renderStudioSongsList();
}

function removeSongSection(idx) {
  if (idx >= 0 && idx < CURRENT_SONG_SECTIONS.length) {
    CURRENT_SONG_SECTIONS.splice(idx, 1);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function duplicateSection(idx) {
  if (CURRENT_SONG_SECTIONS[idx]) {
    const src = CURRENT_SONG_SECTIONS[idx];
    const copy = {
      id: 'sec_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      title: src.title,
      badge: src.badge,
      text: src.text
    };
    CURRENT_SONG_SECTIONS.splice(idx + 1, 0, copy);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function moveSectionUp(idx) {
  if (idx > 0) {
    const item = CURRENT_SONG_SECTIONS.splice(idx, 1)[0];
    CURRENT_SONG_SECTIONS.splice(idx - 1, 0, item);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function moveSectionDown(idx) {
  if (idx < CURRENT_SONG_SECTIONS.length - 1) {
    const item = CURRENT_SONG_SECTIONS.splice(idx, 1)[0];
    CURRENT_SONG_SECTIONS.splice(idx + 1, 0, item);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;

// HTML5 Drag and Drop handlers
function handleSectionDragStart(e, idx) {
  DRAG_SRC_INDEX = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', idx);
  e.currentTarget.classList.add('dragging');
}

function handleSectionDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  if (!el.classList.contains('drag-over')) {
    el.classList.add('drag-over');
  }
}

function handleSectionDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function handleSectionDrop(e, targetIdx) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if (DRAG_SRC_INDEX !== null && DRAG_SRC_INDEX !== targetIdx) {
    const movedItem = CURRENT_SONG_SECTIONS.splice(DRAG_SRC_INDEX, 1)[0];
    CURRENT_SONG_SECTIONS.splice(targetIdx, 0, movedItem);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
  DRAG_SRC_INDEX = null;
}

function handleSectionDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.guide-sec-item').forEach(function(el){
    el.classList.remove('drag-over');
    el.classList.remove('dragging');
  });
  DRAG_SRC_INDEX = null;
}

function loadSongGuideFromJson(jsonOrStr) {
  if (!jsonOrStr) {
    resetDefaultSongStructure();
    return;
  }
  try {
    if (typeof jsonOrStr === 'string' && jsonOrStr.trim().startsWith('[')) {
      CURRENT_SONG_SECTIONS = JSON.parse(jsonOrStr);
    } else if (typeof jsonOrStr === 'string' && jsonOrStr.trim().length > 0) {
      CURRENT_SONG_SECTIONS = [
        { id: 'sec_leg_1', title: 'Hướng dẫn tổng quan', badge: 'badge-custom', text: jsonOrStr }

      CURRENT_SONG_SECTIONS = jsonOrStr;

    resetDefaultSongStructure();
  }
  if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
    STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;

  renderSongGuideBuilder();

const SCORE_CRITERIA = [
  { key: 'pitch',      name: 'Cao độ (Pitch)',                  desc: 'Hát đúng nốt, ít phô',              short: 'Pitch' },
  { key: 'rhythm',     name: 'Nhịp phách (Rhythm)',             desc: 'Vào đúng nhịp, không sớm/trễ',      short: 'Rhythm' },
  { key: 'breath',     name: 'Hơi thở (Breath)',                desc: 'Lấy hơi đúng, không hụt giữa câu',  short: 'Breath' },
  { key: 'tone',       name: 'Chất giọng (Tone)',               desc: 'Âm thoải mái, không gằn cổ',        short: 'Tone' },
  { key: 'expression', name: 'Biểu cảm (Expression)',           desc: 'Thể hiện cảm xúc bài hát',          short: 'Express' },
  { key: 'focusSkill', name: 'Kỹ thuật trọng tâm (Focus Skill)', desc: 'Kỹ thuật đang luyện buổi này',     short: 'Focus' },
  { key: 'homework',   name: 'Bài tập về nhà (Homework)',       desc: 'HV có luyện tập ở nhà không',       short: 'BTVN' },
  { key: 'confidence', name: 'Tự tin & Tương tác (Confidence)', desc: 'Dám hát, chủ động, không run',      short: 'Confid' }
];
const SCORE_LEVELS = [
  { v: 1, icon: '🔴', label: 'Không tốt' },
  { v: 2, icon: '🟡', label: 'Tốt' },
  { v: 3, icon: '🟢', label: 'Xuất sắc' }
];
const FOCUS_SKILLS = ['Mixvoice', 'Belting', 'Falsetto', 'Head voice', 'Vibrato', 'Legato', 'Staccato', 'Breath control', 'Khẩu hình', 'Lip trill', 'Khác'];
const GRADE_TEXT = { A: 'Xuất sắc', B: 'Tốt', C: 'Trung bình', D: 'Cần cải thiện' };

let STUDIO_GROUP = [];   // Học viên trong buổi học (1 người hoặc nhóm)
let SCORECARDS = [];     // [{hocVienId, hoTen, scores:{}, focusSkillName, note}]
let SC_ACTIVE = 0;

function scoreIcon(v) {
  const lv = SCORE_LEVELS.filter(function(l){ return l.v === parseInt(v, 10); })[0];
  return lv ? lv.icon : '⚪';
}

function gradeFromTotal(t) {
  if (t >= 21) return 'A';
  if (t >= 16) return 'B';
  if (t >= 11) return 'C';
  return 'D';
}

function calcScoreSummary(scores) {
  let total = 0, count = 0;
  SCORE_CRITERIA.forEach(function(c){
    const v = parseInt((scores || {})[c.key], 10);
    if (v >= 1 && v <= 3) { total += v; count++; }
  });
  const complete = count === SCORE_CRITERIA.length;
  return { total: total, count: count, complete: complete, grade: complete ? gradeFromTotal(total) : '' };
}

function parseScoreCard(json) {
  if (!json) return null;
  try {
    const o = typeof json === 'string' ? JSON.parse(json) : json;
    return (o && typeof o === 'object' && Object.keys(o).length) ? o : null;
  } catch(e) { return null; }
}

function initScoreCards(students, existingSession) {
  SCORECARDS = students.map(function(s, i){
    const card = { hocVienId: s.id, hoTen: s.hoTen, scores: {}, focusSkillName: '', note: '' };
    if (existingSession && i === 0) {
      card.scores = parseScoreCard(existingSession.scoreCardJson) || {};
      card.focusSkillName = existingSession.focusSkillName || '';
      card.note = existingSession.scoreNote || '';
    }
    return card;
  });
  SC_ACTIVE = 0;
  renderScoreCard();
}

function renderScoreCard() {
  const tabs = $('cf_scoreTabs');
  const box = $('cf_scoreCard');
  if (!box) return;
  const isGroup = SCORECARDS.length > 1;

  tabs.style.display = isGroup ? 'flex' : 'none';
  tabs.innerHTML = isGroup ? SCORECARDS.map(function(c, i){
    const sum = calcScoreSummary(c.scores);
    return '<button type="button" class="sc-tab ' + (i === SC_ACTIVE ? 'active' : '') + '" onclick="switchScoreCardTab(' + i + ')">' +
      esc(c.hoTen) + (sum.complete ? ' ✓' : ' <span class="sc-tab-prog">' + sum.count + '/8</span>') + '</button>';
  }).join('') : '';

  const card = SCORECARDS[SC_ACTIVE];
  if (!card) { box.innerHTML = ''; return; }
  const sum = calcScoreSummary(card.scores);

  const critHtml = SCORE_CRITERIA.map(function(c, i){
    const val = parseInt(card.scores[c.key], 10) || 0;
    const focusSel = c.key === 'focusSkill'
      ? '<select class="sc-focus-select" onchange="setFocusSkillName(this.value)">' +
          '<option value="">— Chọn kỹ thuật trọng tâm —</option>' +
          FOCUS_SKILLS.map(function(k){ return '<option ' + (card.focusSkillName === k ? 'selected' : '') + '>' + k + '</option>'; }).join('') +
        '</select>'
      : '';
    return '<div class="sc-crit">' +
      '<div class="sc-crit-head"><span class="sc-crit-name">' + (i + 1) + '. ' + c.name + '</span><span class="sc-crit-desc">' + c.desc + '</span></div>' +
      focusSel +
      '<div class="sc-levels ' + (val ? 'has-val' : '') + '">' +
        SCORE_LEVELS.map(function(l){
          return '<button type="button" class="sc-btn l' + l.v + (val === l.v ? ' on' : '') + '" onclick="setScoreLevel(\'' + c.key + '\',' + l.v + ')">' +
            l.icon + ' ' + l.label + (val === l.v ? ' ✓' : '') + '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  const gradeHtml = sum.complete
    ? '<span class="grade-badge grade-' + sum.grade + '">Xếp loại: ' + sum.grade + ' (' + GRADE_TEXT[sum.grade] + ')</span>'
    : '<span class="grade-badge grade-none">Đã chấm ' + sum.count + '/8 tiêu chí</span>';

  box.innerHTML = critHtml +
    '<div class="sc-summary"><span>Tổng: <b class="total">' + sum.total + '</b>/24</span>' + gradeHtml + '</div>' +
    '<div class="fld" style="margin-bottom:0">' +
      '<label>' + (isGroup ? 'GHI CHÚ RIÊNG CHO ' + esc(card.hoTen).toUpperCase() + ' (gộp vào nhận xét của HV này)' : 'GHI CHÚ GV (TỰ DO)') + '</label>' +
      '<textarea placeholder="Ghi chú về điểm số, điểm cần cải thiện..." oninput="setScoreNote(this.value)">' + esc(card.note || '') + '</textarea>' +
    '</div>';
}

function setScoreLevel(key, v) {
  const card = SCORECARDS[SC_ACTIVE];
  if (!card) return;
  if (parseInt(card.scores[key], 10) === v) delete card.scores[key]; // bấm lại để bỏ chọn
  else card.scores[key] = v;
  renderScoreCard();
}

function setFocusSkillName(v) { if (SCORECARDS[SC_ACTIVE]) SCORECARDS[SC_ACTIVE].focusSkillName = v; }
function setScoreNote(v) { if (SCORECARDS[SC_ACTIVE]) SCORECARDS[SC_ACTIVE].note = v; }

function switchScoreCardTab(i) {
  SC_ACTIVE = i;
  renderScoreCard();
  if (!EDITING_SESSION_ID && STUDIO_GROUP[i]) renderPrevSessionPanel(STUDIO_GROUP[i]);
}

function scoreFieldsFor(card) {
  const sum = calcScoreSummary(card.scores);
  return {
    scoreCardJson:  sum.count ? JSON.stringify(card.scores) : '',
    totalScore:     sum.count ? sum.total : '',
    sessionGrade:   sum.grade,
    focusSkillName: card.focusSkillName || '',
    scoreNote:      card.note || '',
    diemSo:         sum.complete ? Math.round(sum.total / 24 * 10) : ''
  };
}

// ==================== BUỔI HỌC TRƯỚC (MODULE 2) ====================
let PREV_PANEL_COLLAPSED = false;

function getLastSession(s) {
  const list = ((s && s.buoiHoc) || []).slice();
  if (!list.length) return null;
  list.sort(function(a, b){
    const d = (parseInt(a.buoiSo, 10) || 0) - (parseInt(b.buoiSo, 10) || 0);
    return d !== 0 ? d : String(a.ngayHoc || '').localeCompare(String(b.ngayHoc || ''));
  });
  return list[list.length - 1];
}

function getNextBuoiNumber(s) {
  if (s && Array.isArray(s.buoiHoc)) return s.buoiHoc.length + 1;
  return (parseInt(s && s.soBuoiDaHoc, 10) || 0) + 1;
}

function togglePrevSessionPanel() {
  PREV_PANEL_COLLAPSED = !PREV_PANEL_COLLAPSED;
  $('cf_prevSessionPanel').classList.toggle('collapsed', PREV_PANEL_COLLAPSED);
  const t = $('cf_prevToggle');
  if (t) t.textContent = PREV_PANEL_COLLAPSED ? 'Mở rộng ▼' : 'Thu gọn ▲';
}

function renderPrevSessionPanel(student) {
  const panel = $('cf_prevSessionPanel');
  if (!panel) return;
  if (EDITING_SESSION_ID || !student) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.classList.toggle('collapsed', PREV_PANEL_COLLAPSED);
  const who = STUDIO_GROUP.length > 1 ? ' — ' + esc(student.hoTen) : '';
  const head = function(title){
    return '<div class="prev-sess-head" onclick="togglePrevSessionPanel()"><h3>📋 ' + title + who + '</h3>' +
      '<button type="button" class="btn ghost sm" id="cf_prevToggle">' + (PREV_PANEL_COLLAPSED ? 'Mở rộng ▼' : 'Thu gọn ▲') + '</button></div>';
  };

  // Chưa có chi tiết buổi học → nạp ngầm từ server
  if (!Array.isArray(student.buoiHoc)) {
    const cached = CACHE_STUDENTS_DETAIL[student.id];
    if (cached && Array.isArray(cached.buoiHoc)) { replaceGroupMember(cached); renderPrevSessionPanel(cached); return; }
    panel.innerHTML = head('BUỔI HỌC TRƯỚC') + '<div class="prev-sess-body"><span class="spin"></span> Đang tải buổi học trước...</div>';
    google.script.run.withSuccessHandler(function(full){
      if (!full) return;
      CACHE_STUDENTS_DETAIL[full.id] = full;
      replaceGroupMember(full);
      const active = STUDIO_GROUP[SC_ACTIVE] || STUDIO_GROUP[0];
      if ($('view-classroom-flow').style.display === 'block' && active && String(active.id) === String(full.id)) {
        renderPrevSessionPanel(full);
        renderFinalSessionBanner();
      }
    }).getStudent(student.id);
    return;
  }

  const b = getLastSession(student);
  if (!b) {
    panel.innerHTML = head('BUỔI HỌC TRƯỚC') + '<div class="prev-sess-body" style="color:var(--mut)">Chưa có buổi học trước — đây là buổi học đầu tiên.</div>';
    return;
  }

  // Bài hát
  let songs = [];
  try { const p = typeof b.songsJson === 'string' ? JSON.parse(b.songsJson || '[]') : (b.songsJson || []); if (Array.isArray(p)) songs = p; } catch(e) {}
  let songTxt = songs.filter(function(s){ return s && s.title; }).map(function(s){
    return esc(s.title) + ((s.tone && s.tone !== '0') ? ' <small style="color:var(--gold)">(Tone ' + esc(s.tone) + ')</small>' : '');
  }).join(', ');
  if (!songTxt && b.baiHat) songTxt = esc(b.baiHat);

  // Kỹ thuật
  let techs = [];
  try { const p = typeof b.techsJson === 'string' ? JSON.parse(b.techsJson || '[]') : (b.techsJson || []); if (Array.isArray(p)) techs = p; } catch(e) {}
  let techTxt = techs.filter(function(t){ return t && t.name; }).map(function(t){ return esc(t.name); }).join(', ');
  if (!techTxt && b.kyThuat) techTxt = esc(String(b.kyThuat).replace(/^•\s*/, ''));

  // Phiếu chấm
  const sc = parseScoreCard(b.scoreCardJson);
  let scoreHtml = '';
  if (sc) {
    const sum = calcScoreSummary(sc);
    scoreHtml = '<div style="margin-top:6px"><b>Phiếu chấm:</b>' + (b.focusSkillName ? ' <small style="color:var(--mut)">(Focus: ' + esc(b.focusSkillName) + ')</small>' : '') + '</div>' +
      '<div class="prev-score-grid">' + SCORE_CRITERIA.map(function(c){
        return '<span>' + c.short + ': ' + scoreIcon(sc[c.key]) + '</span>';
      }).join('') + '</div>' +
      '<div>→ Tổng: <b>' + sum.total + '/24</b>' + (sum.grade ? ' · <span class="grade-badge grade-' + sum.grade + '">Loại ' + sum.grade + '</span>' : ' <small style="color:var(--mut)">(chấm ' + sum.count + '/8)</small>') + '</div>';
  } else if (b.diemSo) {
    scoreHtml = '<div style="margin-top:6px"><b>Điểm buổi học:</b> ' + esc(b.diemSo) + '/10 <small style="color:var(--mut)">(phiếu cũ)</small></div>';
  }

  panel.innerHTML = head('BUỔI HỌC TRƯỚC (Buổi ' + esc(b.buoiSo || '?') + ' · ' + fmtDate(b.ngayHoc) + ')') +
    '<div class="prev-sess-body">' +
      (songTxt ? '<div><b>🎵 Bài hát:</b> ' + songTxt + '</div>' : '') +
      (techTxt ? '<div><b>🎼 Kỹ thuật:</b> ' + techTxt + '</div>' : '') +
      scoreHtml +
      (b.nhanXet ? '<div style="margin-top:6px;color:var(--teal)"><b>GV nhận xét:</b> "' + esc(b.nhanXet) + '"</div>' : '') +
      (b.baiTapVeNha ? '<div style="color:var(--gold)"><b>BTVN đã giao:</b> "' + esc(b.baiTapVeNha) + '"</div>' : '') +
    '</div>';
}

function replaceGroupMember(full) {
  STUDIO_GROUP.forEach(function(m, i){
    if (String(m.id) === String(full.id)) STUDIO_GROUP[i] = full;
  });
}

// ==================== NHẮC TEST RANK CUỐI KHOÁ (MODULE 7) ====================
const RANK_ORDER = ['A', 'B', 'C', 'D'];
let FINAL_BANNER_DISMISSED = {};

function nextRankOf(r) {
  const i = RANK_ORDER.indexOf(String(r || 'A').toUpperCase());
  if (i === -1) return 'B';
  return i >= RANK_ORDER.length - 1 ? 'D (cao nhất)' : RANK_ORDER[i + 1];
}

function getCourseProgress(s) {
  const total = parseInt(s.soBuoiKhoa || s.soBuoiDeal, 10) || 0;
  const hasCounter = s.soBuoiConLai !== undefined && s.soBuoiConLai !== null && s.soBuoiConLai !== '';
  const done = hasCounter ? (parseInt(s.soBuoiDaHoc, 10) || 0)
    : (Array.isArray(s.buoiHoc) ? s.buoiHoc.length : (parseInt(s.soBuoiDaHoc, 10) || 0));
  const left = hasCounter ? Math.max(0, parseInt(s.soBuoiConLai, 10) || 0) : Math.max(0, total - done);
  return { total: total, done: done, left: left };
}

function renderFinalSessionBanner() {
  const box = $('cf_finalBanner');
  if (!box) return;
  if (EDITING_SESSION_ID) { box.style.display = 'none'; return; }
  const items = STUDIO_GROUP.filter(function(s){
    const p = getCourseProgress(s);
    return p.total > 0 && p.left <= 1 && !FINAL_BANNER_DISMISSED[s.id];
  });
  if (!items.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'block';
  box.innerHTML = items.map(function(s){
    const p = getCourseProgress(s);
    const desc = p.left === 1
      ? 'Đây là buổi học cuối cùng (' + p.total + '/' + p.total + ') của khoá hiện tại.'
      : 'Khoá hiện tại đã học hết ' + p.done + '/' + p.total + ' buổi — nhớ gia hạn khoá mới.';
    return '<div class="final-banner">' +
      '<h3>🎓 BUỔI HỌC CUỐI KHOÁ — Nhắc Test Rank!' + (STUDIO_GROUP.length > 1 ? ' · ' + esc(s.hoTen) : '') + '</h3>' +
      '<p>' + desc + ' Hãy thực hiện Test Rank để đánh giá tiến bộ và đề xuất lộ trình khoá tiếp theo.</p>' +
      '<p>Rank hiện tại: <b>' + esc(s.rank || 'A') + '</b> · Rank mục tiêu: <b style="color:var(--teal)">' + nextRankOf(s.rank) + '</b></p>' +
      '<div class="row-flex">' +
        '<button type="button" class="btn gold" onclick="openFinalTestFor(\'' + s.id + '\')">🪄 Test Rank ngay</button>' +
        '<button type="button" class="btn ghost" onclick="dismissFinalBanner(\'' + s.id + '\')">Bỏ qua</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function dismissFinalBanner(id) {
  FINAL_BANNER_DISMISSED[id] = true;
  renderFinalSessionBanner();
}

function openFinalTestFor(id) {
  const s = STUDIO_GROUP.filter(function(x){ return String(x.id) === String(id); })[0];
  if (s) openTestModalFor(s, 'studio');
}

// ==================== HỌC NHÓM (MODULE 4) ====================
function getGroupClasses() {
  return String(APP_CONFIG.groupClasses || 'TN12').split(',')
    .map(function(x){ return x.trim().toUpperCase(); }).filter(Boolean);
}

function getGroupCandidates(s) {
  const lop = String(s.lop || '').trim().toUpperCase();
  if (!lop || getGroupClasses().indexOf(lop) === -1) return [];
  return getOfficialStudents().filter(function(x){
    return String(x.id) !== String(s.id) &&
      String(x.lop || '').trim().toUpperCase() === lop &&
      String(x.tinhTrang || '').indexOf('Đang học') >= 0;
  });
}

function groupMemberLabel(s) {
  const p = getCourseProgress(s);
  return '<b>' + esc(s.hoTen) + '</b> <small>(' + esc(s.lop || '—') + ' · GV ' + esc(s.giaoVien || '—') + ' · Còn ' + p.left + ' buổi)</small>';
}

function openGroupSessionModal(mates) {
  $('grp_intro').innerHTML = 'Học viên <b>' + esc(CUR_STUDENT.hoTen) + '</b> thuộc lớp <b>' + esc(CUR_STUDENT.lop) + '</b>. Bạn muốn bắt đầu buổi học nhóm?';
  $('grp_list').innerHTML =
    '<label class="grp-item"><input type="checkbox" checked disabled> ' + groupMemberLabel(CUR_STUDENT) + '</label>' +
    mates.map(function(m){
      return '<label class="grp-item"><input type="checkbox" class="grp-chk" value="' + m.id + '" checked> ' + groupMemberLabel(m) + '</label>';
    }).join('');
  open_('mGroupSession');
}

function startGroupFromModal() {
  const ids = Array.from(document.querySelectorAll('.grp-chk:checked')).map(function(c){ return c.value; });
  const members = ids.map(function(id){
    return CACHE_STUDENTS_DETAIL[id] || ALL_STUDENTS.filter(function(x){ return String(x.id) === String(id); })[0];
  }).filter(Boolean);
  close_('mGroupSession');
  beginClassroomFlow(members);
}

function startSoloFromGroupModal() {
  close_('mGroupSession');
  beginClassroomFlow([]);
}

// ==================== STUDIO GIẢNG DẠY ====================
function startClassroomFlow() {
  if (!CUR_STUDENT) return;
  const mates = getGroupCandidates(CUR_STUDENT);
  if (mates.length) { openGroupSessionModal(mates); return; }
  beginClassroomFlow([]);
}

function setStudioHeader() {
  const nextBuoi = getNextBuoiNumber(CUR_STUDENT);
  if (STUDIO_GROUP.length > 1) {
    $('cfStudentName').innerHTML = STUDIO_GROUP.map(function(s){ return esc(s.hoTen); }).join(' + ') +
      ' · <b style="color:var(--gold)">Buổi ' + nextBuoi + ' (Nhóm ' + esc(CUR_STUDENT.lop || '') + ')</b>';
  } else {
    $('cfStudentName').innerHTML = esc(CUR_STUDENT.hoTen) + ' · <b style="color:var(--gold)">Buổi ' + nextBuoi + '</b>';
  }
  $('cf_nhanXetLabel').textContent = STUDIO_GROUP.length > 1
    ? 'NHẬN XÉT CHUNG (TẤT CẢ HỌC VIÊN TRONG NHÓM THẤY)'
    : 'NHẬN XÉT CỦA GIÁO VIÊN (HỌC VIÊN CÓ THỂ XEM)';
}

function enterStudioLayout() {
  $('mainSidebar').style.display  = 'none';
  document.body.style.paddingLeft = '0';
  showOnlyView('classroom-flow');
}

function beginClassroomFlow(groupMembers) {
  EDITING_SESSION_ID = null;
  FINAL_BANNER_DISMISSED = {};
  STUDIO_GROUP = [CUR_STUDENT].concat(groupMembers || []);
  setStudioHeader();
  enterStudioLayout();

  // Khởi tạo bài hát & kỹ thuật trống
  STUDIO_SONGS = [{
    id: 'song_' + Date.now(),
    title: '',
    ytLink: '',
    noteCao: '',
    noteThap: '',
    tone: '0',
    details: '',
    guideSections: getDefaultSongStructure()
  }];
  ACTIVE_SONG_GUIDE_INDEX = 0;
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[0].guideSections;
  renderStudioSongsList();
  renderSongGuideTabs();
  renderSongGuideBuilder();

  STUDIO_TECHS = [{ id: 'tech_' + Date.now(), name: '', ytLink: '', notes: '' }];
  renderStudioTechList();

  $('cf_btvn').value        = '';
  $('cf_nhanXet').value     = '';
  $('cf_ghiChuNoiBo').value = '';

  initScoreCards(STUDIO_GROUP, null);
  renderPrevSessionPanel(CUR_STUDENT);
  renderFinalSessionBanner();

  // Nạp chi tiết các HV khác trong nhóm (để biết số buổi chính xác & buổi trước)
  STUDIO_GROUP.slice(1).forEach(function(m){
    if (Array.isArray(m.buoiHoc)) return;
    google.script.run.withSuccessHandler(function(full){
      if (!full) return;
      CACHE_STUDENTS_DETAIL[full.id] = full;
      replaceGroupMember(full);
      renderFinalSessionBanner();
    }).getStudent(m.id);
  });

  window.scrollTo(0,0);
}

// NẠP LẠI DỮ LIỆU BUỔI HỌC CŨ VÀO STUDIO
function openPastSessionInStudio(sessionId) {
  if (!CUR_STUDENT) return;
  const list = CUR_STUDENT.buoiHoc || [];
  const b = list.find(function(x){ return String(x.id) === String(sessionId); }) || list[list.length - 1];
  if (!b) { toast('⚠️ Không tìm thấy dữ liệu buổi học'); return; }

  EDITING_SESSION_ID = b.id || sessionId;
  $('cfStudentName').innerHTML = esc(CUR_STUDENT.hoTen) + ' · <b style="color:var(--gold)">Đang xem: Buổi ' + (b.buoiSo || '') + ' (' + fmtDate(b.ngayHoc) + ')</b>';

  // Ẩn sidebar để full màn hình studio
  $('mainSidebar').style.display          = 'none';
  document.body.style.paddingLeft         = '0';
  $('view-student-profile').style.display = 'none';
  $('view-classroom-flow').style.display  = 'block';

  // Restore songs
  if (b.songsJson) {
    try {
      STUDIO_SONGS = typeof b.songsJson === 'string' ? JSON.parse(b.songsJson) : b.songsJson;
    } catch(e) {
      STUDIO_SONGS = [];
    }
  } else {
    STUDIO_SONGS = [];
  }
  if (!Array.isArray(STUDIO_SONGS) || !STUDIO_SONGS.length) {
    STUDIO_SONGS = [{
      id: 'song_1',
      title: (b.baiHat && b.baiHat.indexOf('http') === 0) ? 'Bài hát thực hành' : (b.baiHat || ''),
      ytLink: b.linkYoutube || ((b.baiHat && b.baiHat.indexOf('http') === 0) ? b.baiHat : ''),
      noteCao: b.noteCao || '',
      noteThap: b.noteThap || '',
      tone: '0',
      details: b.noiDung || '',
      guideSections: getDefaultSongStructure()
    }];
    if (b.huongDanHatJson) {
      try {
        if (typeof b.huongDanHatJson === 'string' && b.huongDanHatJson.trim().startsWith('[')) {
          STUDIO_SONGS[0].guideSections = JSON.parse(b.huongDanHatJson);
        }
      } catch(e) {}
    }
  } else {
    STUDIO_SONGS.forEach(function(s, sIdx){
      if (!s.guideSections || !Array.isArray(s.guideSections) || !s.guideSections.length) {
        if (sIdx === 0 && b.huongDanHatJson) {
          try {
            if (typeof b.huongDanHatJson === 'string' && b.huongDanHatJson.trim().startsWith('[')) {
              s.guideSections = JSON.parse(b.huongDanHatJson);
            } else {
              s.guideSections = getDefaultSongStructure();
            }
          } catch(e) {
            s.guideSections = getDefaultSongStructure();
          }
        } else {
          s.guideSections = getDefaultSongStructure();
        }
      }
      if (s.tone === undefined) s.tone = '0';
    });
    if (!STUDIO_SONGS[0].ytLink && b.linkYoutube) {
      STUDIO_SONGS[0].ytLink = b.linkYoutube;
    }
  }
  ACTIVE_SONG_GUIDE_INDEX = 0;
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[0].guideSections;
  renderStudioSongsList();
  renderSongGuideTabs();
  renderSongGuideBuilder();

  // Restore techs
  if (b.techsJson) {
    try {
      STUDIO_TECHS = typeof b.techsJson === 'string' ? JSON.parse(b.techsJson) : b.techsJson;
    } catch(e) {
      STUDIO_TECHS = [];
    }
  } else {
    STUDIO_TECHS = [];
  }
  if (!Array.isArray(STUDIO_TECHS) || !STUDIO_TECHS.length) {
    STUDIO_TECHS = [{
      id: 'tech_1',
      name: b.kyThuat || '',
      ytLink: b.linkYoutubeKyThuat || '',
      notes: ''
    }];
  } else {
    if (!STUDIO_TECHS[0].ytLink && b.linkYoutubeKyThuat) {
      STUDIO_TECHS[0].ytLink = b.linkYoutubeKyThuat;
    }
  }
  renderStudioTechList();

  $('cf_btvn').value        = b.baiTapVeNha || '';
  $('cf_nhanXet').value     = b.nhanXet || '';
  $('cf_ghiChuNoiBo').value = b.ghiChuNoiBo || '';
  
  STUDIO_GROUP = [CUR_STUDENT];
  $('cf_nhanXetLabel').textContent = 'NHẬN XÉT CỦA GIÁO VIÊN (HỌC VIÊN CÓ THỂ XEM)';
  initScoreCards(STUDIO_GROUP, b);
  renderPrevSessionPanel(null);
  renderFinalSessionBanner();

  toast('✅ Đã nạp lại dữ liệu Buổi ' + (b.buoiSo || ''));
  window.scrollTo(0,0);
}

function finishClassroomSession() {
  syncStudioSongsAndTechsFromDom();

  const nextBuoi = EDITING_SESSION_ID
    ? (CUR_STUDENT.buoiHoc ? (CUR_STUDENT.buoiHoc.find(function(x){ return String(x.id) === String(EDITING_SESSION_ID); }) || {}).buoiSo || 1 : 1)
    : ((CUR_STUDENT.buoiHoc ? CUR_STUDENT.buoiHoc.length : 0) + 1);

  // Lấy thông tin từ danh sách bài hát
  const primarySong = STUDIO_SONGS[0] || {};
  const songTitles = STUDIO_SONGS.map(function(s){ return s.title; }).filter(Boolean).join(' / ') || 'Thực hành bài hát';
  const songYt = primarySong.ytLink || (STUDIO_SONGS.find(function(s){ return s.ytLink; }) || {}).ytLink || '';
  const noteCao = primarySong.noteCao || '';
  const noteThap = primarySong.noteThap || '';
  const songDetails = STUDIO_SONGS.map(function(s){
    let tInfo = (s.tone && s.tone !== '0') ? (' [Tone: ' + s.tone + ']') : '';
    return (s.title ? ('🎵 ' + s.title + tInfo + ': ') : '') + (s.details || '');
  }).filter(Boolean).join('\n');

  // Lấy thông tin từ danh sách kỹ thuật
  const primaryTech = STUDIO_TECHS[0] || {};
  const techNames = STUDIO_TECHS.map(function(t){
    return t.name + (t.notes ? (' (' + t.notes + ')') : '');
  }).filter(Boolean).join('\n• ');
  const techYt = primaryTech.ytLink || (STUDIO_TECHS.find(function(t){ return t.ytLink; }) || {}).ytLink || '';

  const data = {
    id:                 EDITING_SESSION_ID || '',
    hocVienId:          CUR_STUDENT.id,
    ngayHoc:            new Date().toISOString().slice(0, 10),
    buoiSo:             nextBuoi,
    baiHat:             songTitles,
    linkYoutube:        songYt,
    noteCao:            noteCao,
    noteThap:           noteThap,
    noiDung:            songDetails,
    kyThuat:            techNames ? ('• ' + techNames) : '',
    linkYoutubeKyThuat: techYt,
    huongDanHatJson:    getSongGuideJson(),
    baiTapVeNha:        $('cf_btvn').value,
    nhanXet:            $('cf_nhanXet').value,
    ghiChuNoiBo:        $('cf_ghiChuNoiBo').value,
    diemSo:             STUDIO_SESSION_SCORE,
    songsJson:          JSON.stringify(STUDIO_SONGS),
    techsJson:          JSON.stringify(STUDIO_TECHS)
  };

  // Kiểm tra phiếu chấm chưa đủ tiêu chí
  const incomplete = SCORECARDS.filter(function(c){ return !calcScoreSummary(c.scores).complete; });
  if (incomplete.length) {
    const names = incomplete.map(function(c){ return c.hoTen + ' (' + calcScoreSummary(c.scores).count + '/8)'; }).join(', ');
    if (!confirm('Phiếu chấm chưa đủ 8 tiêu chí: ' + names + '.\nVẫn lưu buổi học?')) return;
  }

  const afterSave = function(msg){
    toast(msg);
    STUDIO_GROUP.forEach(function(m){ delete CACHE_STUDENTS_DETAIL[m.id]; });
    delete CACHE_STUDENTS_DETAIL[CUR_STUDENT.id];

    // Quay lại profile
    $('mainSidebar').style.display  = 'flex';
    document.body.style.paddingLeft = '240px';

    // Nạp lại dữ liệu học viên
    openStudentProfile(CUR_STUDENT.id);
    loadStudents();
  };

  const isGroup = STUDIO_GROUP.length > 1 && !EDITING_SESSION_ID;
  if (!isGroup) {
    Object.assign(data, scoreFieldsFor(SCORECARDS[0] || { scores: {} }));
    google.script.run.withSuccessHandler(function(){
      afterSave('🎉 Đã lưu Buổi ' + nextBuoi + ' thành công!');
    }).saveSession(data);
    return;
  }

  // Buổi học nhóm: nội dung chung + phiếu chấm / nhận xét riêng từng HV
  const common = Object.assign({}, data);
  delete common.id;
  delete common.hocVienId;
  delete common.buoiSo;
  const commonNote = $('cf_nhanXet').value;
  const members = SCORECARDS.map(function(c){
    return Object.assign(scoreFieldsFor(c), {
      hocVienId: c.hocVienId,
      nhanXet: commonNote + (c.note ? ((commonNote ? '\n' : '') + '— Riêng ' + c.hoTen + ': ' + c.note) : '')
    });
  });
  google.script.run
    .withSuccessHandler(function(res){
      if (res && res.success) afterSave('🎉 ' + res.message);
      else toast('⚠️ ' + (res ? res.message : 'Lỗi lưu buổi học nhóm'));
    })
    .withFailureHandler(function(err){ toast('❌ Lỗi: ' + (err ? err.message : 'Không thể kết nối máy chủ')); })
    .saveGroupSession(common, members);
}

function rankChangeMessage(oldRank, newRank) {
  const o = RANK_ORDER.indexOf(String(oldRank || '').toUpperCase());
  const n = RANK_ORDER.indexOf(String(newRank || '').toUpperCase());
  if (o === -1 || n === -1) return '✅ Đã lưu đánh giá · Rank ' + newRank;
  if (n > o) return '🎉 Chúc mừng! Học viên đã lên Rank ' + oldRank + ' → ' + newRank + '!';
  if (n === o) return '✅ Đã lưu đánh giá · Giữ Rank ' + newRank;
  return '⚠️ Đã lưu đánh giá · Rank giảm ' + oldRank + ' → ' + newRank;
}

    target.rank = newRank;

    renderFinalSessionBanner();
    google.script.run.withSuccessHandler(function(full){
      if (!full) return;
      CACHE_STUDENTS_DETAIL[full.id] = full;
      replaceGroupMember(full);
      if (CUR_STUDENT && String(CUR_STUDENT.id) === String(full.id)) CUR_STUDENT = full;
    }).getStudent(target.id);
    loadStudents();
  } else if (TEST_MODE === 'trial') {
    toast('✅ Đã lưu Test học thử · Rank gợi ý ' + newRank);
    loadStudents();
  } else {
    toast(rankChangeMessage(oldRank, newRank));
    openStudentProfile(target.id);
    loadStudents();
  }
}

function recalcSessionCounts() {
  const khoa = parseInt($('f_soBuoiKhoa').value, 10) || 0;
  const daHoc = parseInt($('f_soBuoiDaHoc').value, 10) || 0;
  const conLai = Math.max(0, khoa - daHoc);
  $('f_soBuoiConLai').value = conLai;

  const alertBox = $('formSessionAlertBox');
  if (alertBox) {
    if (khoa > 0 && conLai <= 0) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = 
        '<div style="background:#261210;border:1px solid var(--danger);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<span style="color:#ffb4ab;font-size:12px">🚨 <b>Học viên đã học hết buổi!</b> (Đã học: ' + daHoc + '/' + khoa + ' buổi)</span>' +
          '<button type="button" class="btn sm gold" style="padding:3px 10px;font-size:11.5px" onclick="quickAddSessionsToModal(12)">+ Nạp 12 buổi</button>' +
        '</div>';
    } else if (khoa > 0 && conLai === 1) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = 
        '<div style="background:#261d08;border:1px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<span style="color:#ffe082;font-size:12px">⚠️ <b>Cảnh báo:</b> Học viên chỉ còn đúng <b>1 buổi học</b>!</span>' +
          '<button type="button" class="btn sm gold" style="padding:3px 10px;font-size:11.5px" onclick="quickAddSessionsToModal(12)">+ Nạp 12 buổi</button>' +
        '</div>';
    } else {
      alertBox.style.display = 'none';
      alertBox.innerHTML = '';
    }
  }
}

// ==================== TEST RANK & ĐÁNH GIÁ GIỌNG AI ====================
const CRITERIA = [
  { g:'CAO ĐỘ (Pitch)', items:[['P1','Nghe & lặp đúng 1 nốt đơn'],['P2','Hát đúng scale đi lên'],['P3','Hát đúng scale đi xuống'],['P4','Pitch ổn định trong câu (>80%)'],['P5','Giữ đúng cao độ cuối câu']] },
  { g:'NHỊP (Rhythm)', items:[['R1','Vỗ tay đúng metronome'],['R2','Vào nhạc không sớm/trễ']] },
  { g:'HƠI THỞ (Breath)', items:[['B1','Lấy hơi cơ hoành, không nhấc vai'],['B2','Không hụt hơi giữa câu'],['B3','Sustain âm > 8 giây']] },
  { g:'CHẤT GIỌNG (Tone)', items:[['T1','Âm không bí/nghẹt mũi'],['T2','Không gằn cổ, không căng hàm'],['T3','Có độ vang tự nhiên']] },
  { g:'QUÃNG (Range)', items:[['RG1','Không strain vùng cao']] },
  { g:'PHÁT ÂM', items:[['A1','Phát âm rõ, không nuốt chữ']] },
  { g:'CẢM XÚC & TỰ TIN', items:[['M1','Thể hiện cảm xúc cơ bản'],['M2','Tự nhận biết khi hát sai'],['C1','Không run quá mức']] }
];
const critState = {};

function buildCritList(){
  Object.keys(critState).forEach(function(k){ delete critState[k]; });
  $('critList').innerHTML = CRITERIA.map(function(grp){
    return '<div class="crit-grp"><div class="gh">' + grp.g + '</div>' + grp.items.map(function(it){
      critState[it[0]] = 0;
      return '<div class="crit"><div class="cx">[' + it[0] + '] ' + it[1] + '</div><div class="sc">' +
        '<div class="chip on" onclick="setCrit(this,\'' + it[0] + '\',0)">0</div>' +
        '<div class="chip" onclick="setCrit(this,\'' + it[0] + '\',1)">1</div></div></div>';
    }).join('') + '</div>';
  }).join('');
}

function setCrit(el, code, val){
  critState[code] = val;
  const row = el.parentElement;
  row.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
  calcRank();
}

function calcRank(){
  let t = 0;
  Object.keys(critState).forEach(function(k){ t += critState[k]; });
  let r = 'A';
  if (t >= 15) r = 'D';
  else if (t >= 12) r = 'C';
  else if (t >= 7) r = 'B';
  $('v_tong').textContent = t;
  $('v_rank').textContent = r;
  return { t: t, r: r };
}

function critText(){
  return CRITERIA.map(function(grp){
    return grp.items.map(function(it){
      return '[' + it[0] + '] ' + it[1] + ': ' + (critState[it[0]] ? 'Đạt' : 'Chưa đạt');
    }).join('\n');
  }).join('\n');
}

function runVoiceAI(){
  if (!hasPerm('voice', 'edit')) { toast('⚠️ Bạn không có quyền phân tích'); return; }
  const tg = getTestTarget();
  if (!tg) return;
  const rk = calcRank();
  const btn = $('aiVoiceBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> AI đang phân tích…';

  google.script.run.withSuccessHandler(function(out){
    $('v_aiOut').innerHTML = mdBold(out);
    btn.disabled = false;
    btn.textContent = '✨ Phân tích bằng AI';
  }).aiAnalyzeVoice({
    hoTen: tg.hoTen,
    loaiGiong: tg.loaiGiong,
    quangGiong: tg.quangGiong,
    noteThap: $('v_thap').value,
    noteCao: $('v_cao').value,
    tongDiem: rk.t,
    rankGoiY: rk.r,
    mucTieu: tg.mucTieu,

  });

function applyAiVoiceToStudent(){
  const tg = getTestTarget();

  const content = $('v_aiOut').textContent;

  const rk = calcRank();

            '<button class="btn sm gold" style="padding:4px 10px;font-size:11.5px" onclick="quickTogglePayment(\'' + st.id + '\',false)">✓ Đã thu đủ</button>' +

      }).join('');

      renewBody.innerHTML = '<tr><td colspan="5" class="empty" style="padding:16px">Chưa có học viên nào sắp hết buổi trong tháng này.</td></tr>';

function renderAttendanceSheetGrid() {
  if (!CURRENT_TUITION_DATA || !CURRENT_TUITION_DATA.students) return;

  const q = ($('attendanceSearch') ? $('attendanceSearch').value : '').toLowerCase().trim();
  const gvFilter = $('attendanceTeacherFilter') ? $('attendanceTeacherFilter').value : '';
  const payFilter = $('attendancePaymentFilter') ? $('attendancePaymentFilter').value : '';

  const list = CURRENT_TUITION_DATA.students.filter(function(st){
    const matchQ = (st.hoTen + ' ' + st.lop + ' ' + st.giaoVien).toLowerCase().indexOf(q) >= 0;
    const matchGv = !gvFilter || st.giaoVien.toLowerCase().indexOf(gvFilter.toLowerCase()) >= 0;
    const matchPay = !payFilter || (payFilter === 'PAID' ? st.isPaid : !st.isPaid);
    return matchQ && matchGv && matchPay;
  });

  const body = $('attendanceSheetBody');
  if (!body) return;

  if (!list.length) {
    body.innerHTML = '<tr><td colspan="20" class="empty">Không tìm thấy học viên phù hợp với bộ lọc.</td></tr>';
    return;
  }

  body.innerHTML = list.map(function(st, idx){
    // Trạng thái badge
    let badgeHtml = '';
    if (!st.isPaid) {
      badgeHtml = '<span class="badge st-nghi" style="cursor:pointer" onclick="quickTogglePayment(\'' + st.id + '\',false)" title="Bấm để chuyển sang Đã đóng">🚨 Cần thu</span>';
    } else if (st.remainingSessions <= 1) {
      badgeHtml = '<span class="badge st-done" style="cursor:pointer" onclick="openRenewModal(\'' + st.id + '\')" title="Bấm để gia hạn">+ Gia hạn</span>';
    } else {
      badgeHtml = '<span class="badge st-hoc">✓ Đang học</span>';
    }

    // 12 ô điểm danh
    let sessionCells = '';
    for (let b = 1; b <= 12; b++) {
      if (b > st.totalDealSessions) {
        sessionCells += '<td class="col-sess"><div class="sess-box disabled" title="Khóa học chỉ có ' + st.totalDealSessions + ' buổi">—</div></td>';
      } else {
        const isChecked = b <= st.attendedSessionsCount;
        const clickFn = 'quickCheckInSession(\'' + st.id + '\', ' + b + ', ' + st.attendedSessionsCount + ')';
        sessionCells += '<td class="col-sess sess-cell" onclick="' + clickFn + '">' +
          '<div class="sess-box ' + (isChecked ? 'checked' : '') + '" title="Buổi ' + b + (isChecked ? ' (Đã điểm danh - Bấm để huỷ)' : ' (Chưa học - Bấm để điểm danh)') + '">' +
            (isChecked ? '✓' : b) +
          '</div>' +
        '</td>';
      }
    }

    const driveBtn = (st.linkDrive && st.linkDrive.indexOf('http') === 0)
      ? '<a href="' + esc(st.linkDrive) + '" target="_blank" class="pill-note" style="color:var(--teal);padding:2px 6px;font-size:11px">📁 Drive</a>'
      : '<span style="color:#425449">—</span>';

    return '<tr>' +
      '<td style="text-align:center;color:var(--mut)">' + (idx + 1) + '</td>' +
      '<td>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<b style="color:#fff;cursor:pointer" onclick="openStudentProfile(\'' + st.id + '\')">' + esc(st.hoTen) + '</b>' +
          '<span class="badge rk-' + (st.rank || 'A') + '" style="font-size:10px;padding:1px 5px">' + esc(st.rank) + '</span>' +
        '</div>' +
      '</td>' +
      '<td><span class="badge" style="background:#13281d;color:var(--teal)">' + esc(st.lop) + '</span></td>' +
      '<td><b>' + esc(st.giaoVien) + '</b></td>' +
      '<td><b>' + fmtMoney(st.tuitionFee) + '</b></td>' +
      '<td>' + badgeHtml + '</td>' +
      '<td style="text-align:center"><b style="color:' + (st.remainingSessions <= 1 ? 'var(--warn)' : 'var(--teal)') + '">' + st.remainingSessions + '</b> / ' + st.totalDealSessions + '</td>' +
      sessionCells +
      '<td style="text-align:center">' + driveBtn + '</td>' +
      '</tr>';
  }).join('');
}

function quickCheckInSession(studentId, buoiSo, currentAttended) {
  if (!studentId) return;
  const isChecked = buoiSo <= currentAttended;

  if (isChecked) {
    if (!confirm('Bạn có muốn huỷ điểm danh Buổi ' + buoiSo + ' của học viên này không?')) return;
    toast('⏳ Đang huỷ điểm danh...');
    google.script.run
      .withSuccessHandler(function(res){
        if (res && res.success) {
          toast('✅ Đã huỷ điểm danh Buổi ' + buoiSo);
          loadTuitionSettlement();
          loadStudents();
        } else {
          toast('⚠️ ' + (res ? res.message : 'Lỗi huỷ điểm danh'));
        }
      })
      .quickRemoveAttendance(studentId, buoiSo);
  } else {
    toast('⏳ Đang ghi nhận điểm danh Buổi ' + buoiSo + '...');
    google.script.run
      .withSuccessHandler(function(res){
        if (res && res.success) {
          toast('🎉 Đã điểm danh thành công Buổi ' + buoiSo + '!');
          loadTuitionSettlement();
          loadStudents();
        } else {
          toast('⚠️ ' + (res ? res.message : 'Lỗi điểm danh'));
        }
      })
      .quickCheckInAttendance(studentId, buoiSo);
  }
}

function quickTogglePayment(studentId, currentPaid) {
  const newStatus = !currentPaid;
  const statusLabel = newStatus ? 'ĐÃ ĐÓNG ĐỦ HỌC PHÍ' : 'CHƯA ĐÓNG HỌC PHÍ';
  if (!confirm('Chuyển trạng thái học phí học viên sang: ' + statusLabel + '?')) return;

  toast('⏳ Đang cập nhật học phí...');
  google.script.run
    .withSuccessHandler(function(res){
      toast('✅ Đã chuyển trạng thái: ' + statusLabel);
      loadTuitionSettlement();
      loadStudents();
    })
    .updateTuitionPayment(studentId, newStatus);
}

function promptUpdateCashCollected(studentId, currentCash) {
  const input = prompt('Nhập số tiền mặt GV Linh đã thu trực tiếp từ học viên (VNĐ):', currentCash || 0);
  if (input === null) return;
  const amount = parseFloat(input.replace(/[^\d]/g, '')) || 0;

  toast('⏳ Đang cập nhật tiền mặt đã thu...');
  google.script.run
    .withSuccessHandler(function(res){
      toast('✅ Đã cập nhật tiền mặt: ' + fmtMoney(amount));
      loadTuitionSettlement();
      loadStudents();
    })
    .updateTuitionPayment(studentId, undefined, amount);
}
