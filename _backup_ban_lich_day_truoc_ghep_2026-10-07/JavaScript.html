<script>
// ==================== GLOBAL STATE & CACHE ====================
let ALL_STUDENTS = [];
let ALL_USERS = [];
let CUR_STUDENT = null;
let CURRENT_USER = null;
let CACHE_STUDENTS_DETAIL = {};
let CURRENT_VIEW_MODE = localStorage.getItem('tony_view_mode') || 'card';

// Studio Classroom State
let STUDIO_SESSION_SCORE = 8;
let MEDIA_RECORDER = null;
let AUDIO_CHUNKS = [];
let RECORD_TIMER_INT = null;
let RECORD_SECONDS = 0;

const $ = function(id){ return document.getElementById(id); };

// ==================== CỔNG GỌI MÁY CHỦ (RPC + TOKEN ĐĂNG NHẬP) ====================
// API_RUN.withSuccessHandler(fn).tenHam(...) dùng y như google.script.run, nhưng mọi lời gọi
// đi qua hàm rpc() phía máy chủ kèm token để kiểm tra quyền.
const TOKEN_KEY = 'tma_token';
let AUTH_TOKEN = '';
try { AUTH_TOKEN = localStorage.getItem(TOKEN_KEY) || ''; } catch(e) {}

function makeRunner_(succ, fail, userObj) {
  return new Proxy({}, {
    get: function(_, prop) {
      if (typeof prop !== 'string') return undefined;
      if (prop === 'withSuccessHandler') return function(h){ return makeRunner_(h, fail, userObj); };
      if (prop === 'withFailureHandler') return function(h){ return makeRunner_(succ, h, userObj); };
      if (prop === 'withUserObject')     return function(o){ return makeRunner_(succ, fail, o); };
      return function() {
        const args = Array.prototype.slice.call(arguments);
        const onFail = function(msg){
          if (fail) fail(new Error(msg), userObj);
          else toast('⚠️ ' + msg);
        };
        google.script.run
          .withSuccessHandler(function(res){
            if (!res || typeof res !== 'object' || !('ok' in res)) { onFail('Phản hồi không hợp lệ từ máy chủ'); return; }
            if (res.ok) { if (succ) succ(res.data, userObj); return; }
            if (res.auth) { handleAuthExpired(res.error); if (fail) fail(new Error(res.error), userObj); return; }
            onFail(res.error || 'Lỗi không xác định');
          })
          .withFailureHandler(function(e){ onFail((e && e.message) || String(e)); })
          .rpc(AUTH_TOKEN, prop, args);
      };
    }
  });
}
const API_RUN = makeRunner_(null, null, null);

// ==================== ĐĂNG NHẬP / PHIÊN LÀM VIỆC ====================
function setAuthState_(state) {
  document.body.classList.remove('auth-pending', 'auth-login', 'auth-ok');
  document.body.classList.add(state);
}

function togglePw(id) {
  const el = $(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function showLogin(msg) {
  setAuthState_('auth-login');
  $('lg_err').hidden = !msg;
  $('lg_err').textContent = msg || '';
  const btn = $('lg_btn');
  btn.disabled = false;
  btn.textContent = 'Đăng nhập';
  setTimeout(function(){ ($('lg_user').value ? $('lg_pass') : $('lg_user')).focus(); }, 60);
}

function handleAuthExpired(msg) {
  AUTH_TOKEN = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch(e) {}
  CURRENT_USER = null;
  document.querySelectorAll('.overlay.on').forEach(function(o){ o.classList.remove('on'); });
  showLogin(msg || 'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.');
}

function saveToken_(t) {
  AUTH_TOKEN = t || '';
  try { localStorage.setItem(TOKEN_KEY, AUTH_TOKEN); } catch(e) {}
}

function doLogin() {
  const u = $('lg_user').value.trim();
  const p = $('lg_pass').value;
  if (!u || !p) { $('lg_err').hidden = false; $('lg_err').textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu'; return; }
  const btn = $('lg_btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Đang đăng nhập...';
  $('lg_err').hidden = true;
  API_RUN
    .withSuccessHandler(function(res){
      saveToken_(res.token);
      $('lg_pass').value = '';
      startSession(res.me);
      if (res.weakPassword) {
        setTimeout(function(){
          toast('🔐 Mật khẩu hiện tại quá ngắn, vui lòng đổi mật khẩu mới');
          openChangePw(true);
        }, 700);
      }
    })
    .withFailureHandler(function(err){
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
      $('lg_err').hidden = false;
      $('lg_err').textContent = err.message;
    })
    .login(u, p);
}
$('loginForm').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });

function logout() {
  AUTH_TOKEN = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch(e) {}
  CURRENT_USER = null;
  ALL_STUDENTS = []; ALL_USERS = []; CACHE_STUDENTS_DETAIL = {};
  SCH.board = null;
  document.body.classList.remove('role-hv', 'role-admin', 'view-schedule');
  document.querySelectorAll('.overlay.on').forEach(function(o){ o.classList.remove('on'); });
  showLogin('');
}

function bootApp() {
  if (!AUTH_TOKEN) { showLogin(''); return; }
  API_RUN
    .withSuccessHandler(function(me){ startSession(me); })
    .withFailureHandler(function(err){ if (!document.body.classList.contains('auth-login')) showLogin(err.message); })
    .whoAmI();
}

function startSession(me) {
  CURRENT_USER = me;
  setAuthState_('auth-ok');
  document.body.classList.toggle('role-hv', me.role === 'hv');
  document.body.classList.toggle('role-admin', me.role === 'admin');

  if (me.role === 'hv') {
    goView('my-schedule');
    return;
  }

  const roleText = me.role === 'admin' ? 'Admin · Toàn quyền' : 'Giảng viên';
  $('curUserName').textContent = me.hoTen;
  $('curUserRoleBadge').textContent = roleText;
  $('acName').textContent = me.hoTen;
  $('acRole').textContent = roleText + ' · @' + me.username;
  document.querySelectorAll('[data-view="settings"]').forEach(function(a){ a.style.display = hasPerm('settings', 'view') ? '' : 'none'; });
  updateUiByPermissions();

  API_RUN.withSuccessHandler(function(url){
    if (url) $('dbLink').innerHTML = '<a href="' + url + '" target="_blank">📊 Google Sheet DB</a>';
  }).getDbUrl();

  switchStudentView(CURRENT_VIEW_MODE);
  loadUsers();
  goView('dashboard');
  checkLegacyData();
}

function openAccountSheet() { open_('mAccount'); }

function openChangePw(forced) {
  $('cpOld').value = ''; $('cpNew').value = ''; $('cpNew2').value = '';
  $('cpSub').textContent = forced ? 'Mật khẩu hiện tại quá ngắn hoặc là mật khẩu mặc định, hãy đặt mật khẩu mới (tối thiểu 6 ký tự).' : 'Mật khẩu mới tối thiểu 6 ký tự';
  open_('mChangePw');
  setTimeout(function(){ $('cpOld').focus(); }, 60);
}

function submitChangePw() {
  const oldPw = $('cpOld').value, n1 = $('cpNew').value, n2 = $('cpNew2').value;
  if (n1.length < 6) { toast('⚠️ Mật khẩu mới phải có ít nhất 6 ký tự'); return; }
  if (n1 !== n2) { toast('⚠️ Hai lần nhập mật khẩu mới không khớp'); return; }
  const btn = $('cpBtn');
  btn.disabled = true;
  API_RUN
    .withSuccessHandler(function(res){
      btn.disabled = false;
      if (res.token) saveToken_(res.token);
      close_('mChangePw');
      toast('✅ ' + res.message);
    })
    .withFailureHandler(function(err){ btn.disabled = false; toast('⚠️ ' + err.message); })
    .changeMyPassword(oldPw, n1);
}

function toast(m){
  const t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2400);
}
function open_(id){ $(id).classList.add('on'); }
function close_(id){ $(id).classList.remove('on'); }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function mdBold(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }

function fmtDate(d) {
  if (!d) return '—';
  if (typeof d === 'string') {
    d = d.trim();
    if (!d) return '—';
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(d)) return d;
    if (d.indexOf('-') > 0) {
      const parts = d.split('T')[0].split('-');
      if (parts.length === 3) {
        if (parts[0].length === 4) return parts[2] + '/' + parts[1] + '/' + parts[0];
        if (parts[2].length === 4) return parts[0] + '/' + parts[1] + '/' + parts[2];
      }
    }
    const dt = new Date(d);
    if (!isNaN(dt.getTime())) {
      const day = String(dt.getDate()).padStart(2, '0');
      const mon = String(dt.getMonth() + 1).padStart(2, '0');
      const yr  = dt.getFullYear();
      return day + '/' + mon + '/' + yr;
    }
    return d;
  }
  if (d instanceof Date && !isNaN(d.getTime())) {
    const day = String(d.getDate()).padStart(2, '0');
    const mon = String(d.getMonth() + 1).padStart(2, '0');
    const yr  = d.getFullYear();
    return day + '/' + mon + '/' + yr;
  }
  return String(d);
}

// ==================== AVATAR HELPERS ====================
function getInitials(name) {
  if (!name) return 'HV';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getAvatarHtml(s, sizeClass) {
  const rank = String(s.rank || 'A').toUpperCase();
  const rkBorder = 'rk-border-' + rank;
  const cls = 'st-avatar ' + rkBorder + ' ' + (sizeClass || '');
  if (s.avatar && String(s.avatar).trim().length > 5) {
    return '<div class="' + cls + '" style="background-image:url(\'' + esc(s.avatar) + '\');background-size:cover;background-position:center;background-repeat:no-repeat;"></div>';
  }
  return '<div class="' + cls + '">' + esc(getInitials(s.hoTen)) + '</div>';
}

function updateAvatarPreview(url) {
  const box = $('avatarPreviewBox');
  if (url && String(url).trim().length > 5) {
    box.style.backgroundImage = "url('" + url + "')";
    box.style.backgroundSize = "cover";
    box.style.backgroundPosition = "center";
    box.textContent = '';
  } else {
    box.style.backgroundImage = 'none';
    box.textContent = getInitials($('f_hoTen').value);
  }
}

function updateInitialsAvatar(name) {
  if (!$('f_avatar').value) {
    const box = $('avatarPreviewBox');
    box.style.backgroundImage = 'none';
    box.textContent = getInitials(name);
  }
}

function handleAvatarFileSelect(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxSize = 220; // Nén kích thước chuẩn avatar tròn 220px siêu nhẹ (<10KB)
        let w = img.width;
        let h = img.height;
        if (w > h) {
          if (w > maxSize) {
            h = Math.round((h * maxSize) / w);
            w = maxSize;
          }
        } else {
          if (h > maxSize) {
            w = Math.round((w * maxSize) / h);
            h = maxSize;
          }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
        $('f_avatar').value = compressedDataUrl;
        updateAvatarPreview(compressedDataUrl);
        toast('✅ Đã nạp & tối ưu ảnh đại diện');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function removeAvatar() {
  $('f_avatar').value = '';
  $('f_avatar_file').value = '';
  const box = $('avatarPreviewBox');
  box.style.backgroundImage = 'none';
  box.textContent = getInitials($('f_hoTen').value);
  toast('Đã xoá ảnh đại diện');
}

// ==================== VIEW SWITCHER (CARD / GRID / TABLE) ====================
function switchStudentView(mode) {
  CURRENT_VIEW_MODE = mode;
  localStorage.setItem('tony_view_mode', mode);

  $('btnViewCard').classList.toggle('active', mode === 'card');
  $('btnViewGrid').classList.toggle('active', mode === 'grid');
  $('btnViewTable').classList.toggle('active', mode === 'table');

  $('studentCardsContainer').style.display = mode === 'card' ? 'grid' : 'none';
  $('studentGridContainer').style.display  = mode === 'grid' ? 'grid' : 'none';
  $('studentTableContainer').style.display = mode === 'table' ? 'block' : 'none';

  renderStudents();
}

// ==================== ĐIỀU HƯỚNG TỔNG QUAN ====================
const MAIN_VIEWS = ['dashboard', 'schedule', 'students', 'tuition', 'settings', 'my-schedule'];

function goView(v) {
  if (!CURRENT_USER) return;
  const isHv = CURRENT_USER.role === 'hv';
  if (isHv) v = 'my-schedule';
  if (v === 'settings' && !hasPerm('settings', 'view')) { toast('⚠️ Bạn không có quyền truy cập mục Cấu hình'); return; }
  if (v === 'tuition' && CURRENT_USER.role !== 'admin') { toast('⚠️ Chỉ Admin xem được Học phí & Quyết toán'); return; }

  document.querySelectorAll('.nav a, .mnav a[data-view]').forEach(function(x){ x.classList.toggle('active', x.dataset.view === v); });
  MAIN_VIEWS.forEach(function(id){ $('view-' + id).style.display = id === v ? 'block' : 'none'; });
  $('view-student-profile').style.display = 'none';
  $('view-classroom-flow').style.display  = 'none';
  $('mainSidebar').style.display          = isHv ? 'none' : 'flex';
  document.body.style.paddingLeft         = isHv ? '0' : '240px';
  document.body.classList.toggle('view-schedule', v === 'schedule');
  if (v !== 'schedule') schClearSelection();
  window.scrollTo(0, 0);

  if (v === 'dashboard')   loadDashboard();
  if (v === 'schedule')    schOpen();
  if (v === 'students')    loadStudents();
  if (v === 'tuition')     loadTuitionSettlement();
  if (v === 'settings')    loadSettingsView();
  if (v === 'my-schedule') loadMySchedule();
}

document.querySelectorAll('.nav a, .mnav a[data-view]').forEach(function(a){
  a.onclick = function(){ goView(a.dataset.view); };
});

// Profile Tabs
document.querySelectorAll('.profile-header-bar + .profile-hero + .profile-quick-info + .tabs button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.profile-header-bar + .profile-hero + .profile-quick-info + .tabs button').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    document.querySelectorAll('.ptabpane').forEach(function(p){ p.style.display = 'none'; });
    $('ptab-' + b.dataset.ptab).style.display = 'block';
  };
});

// ==================== PHÂN QUYỀN ====================
function hasPerm(module, act) {
  if (!CURRENT_USER || CURRENT_USER.role === 'hv') return false;
  if (CURRENT_USER.role === 'admin') return true;
  const p = CURRENT_USER.permissions || {};
  if (p[module] && p[module][act]) return true;
  return false;
}

function updateUiByPermissions() {
  const canAddSt = hasPerm('students', 'edit');
  if ($('btnAddNewStudent')) $('btnAddNewStudent').style.display = canAddSt ? 'inline-flex' : 'none';
  const canDeleteSt = hasPerm('students', 'delete');
  if ($('btnDeleteStProfile')) $('btnDeleteStProfile').style.display = canDeleteSt ? 'inline-flex' : 'none';
  if ($('btnDeleteSelectedStudents')) $('btnDeleteSelectedStudents').style.display = canDeleteSt ? 'inline-flex' : 'none';
}


// ==================== DASHBOARD ====================
function loadDashboard(){
  API_RUN.withSuccessHandler(function(d){
    const cards = [
      ['g', d.tong, 'Tổng học viên'],
      ['t', d.dangHoc, 'Đang học'],
      ['o', d.hoanThanh, 'Đã hoàn thành'],
      ['r', d.nghi, 'Đã nghỉ'],
      ['m', d.hocThu, 'Học thử']
    ];
    $('statCards').innerHTML = cards.map(function(c){
      return '<div class="stat ' + c[0] + '"><span class="bar"></span><div class="n">' + c[1] + '</div><div class="l">' + c[2] + '</div></div>';
    }).join('');
    const rc = { A:'#C5A059', B:'#34D399', C:'#6bb0e0', D:'#b78fe0' };
    $('rankChart').innerHTML = barChart(d.byRank, rc);
    $('lopChart').innerHTML  = barChart(d.byLop, null);
  }).getDashboard();
}

function barChart(obj, colors){
  const keys = Object.keys(obj);
  if (!keys.length) return '<div class="empty">Chưa có dữ liệu</div>';
  const max = Math.max.apply(null, keys.map(function(k){ return obj[k]; })) || 1;
  const pal = ['#3A5A42', '#4d7358', '#C5A059', '#34D399', '#6bb0e0', '#b78fe0'];
  return keys.map(function(k, i){
    const col = colors ? (colors[k] || pal[i % pal.length]) : pal[i % pal.length];
    const w = Math.max(8, Math.round(obj[k] / max * 100));
    return '<div class="brow"><div class="k">' + esc(k) + '</div><div class="track">' +
      '<div class="fill" style="width:' + w + '%;background:' + col + '">' + obj[k] + '</div></div></div>';
  }).join('');
}

// ==================== HỌC VIÊN: DANH SÁCH ====================
function loadStudents(){
  API_RUN.withSuccessHandler(function(list){
    ALL_STUDENTS = list || [];
    renderStudents();
  }).getStudents();
}

function stBadge(st){
  st = String(st || '');
  let c = 'st-thu';
  if (st.indexOf('Đang') >= 0) c = 'st-hoc';
  else if (st.indexOf('hoàn thành') >= 0) c = 'st-done';
  else if (st.indexOf('nghỉ') >= 0 || st.indexOf('Nghỉ') >= 0) c = 'st-nghi';
  return '<span class="badge ' + c + '">' + esc(st) + '</span>';
}

function renderStudents(){
  const q = ($('search').value || '').toLowerCase();
  const rkFilter = $('filterRank').value;

  const list = ALL_STUDENTS.filter(function(s){
    const matchQ = (String(s.hoTen) + ' ' + String(s.lop) + ' ' + String(s.giaoVien) + ' ' + String(s.loaiGiong)).toLowerCase().indexOf(q) >= 0;
    const matchRk = !rkFilter || String(s.rank).toUpperCase() === rkFilter.toUpperCase();
    return matchQ && matchRk;
  });

  $('stCount').textContent = ALL_STUDENTS.length + ' học viên · hiện ' + list.length;
  $('stEmpty').style.display = list.length ? 'none' : 'block';

  if (CURRENT_VIEW_MODE === 'card') {
    renderCardsView(list);
  } else if (CURRENT_VIEW_MODE === 'grid') {
    renderGridView(list);
  } else {
    renderTableView(list);
  }
  updateSelectedStudentCount();
}

function renderCardsView(list) {
  const canDelete = hasPerm('students', 'delete');
  $('studentCardsContainer').innerHTML = list.map(function(s){
    const rk = s.rank || 'A';
    const total = parseInt(s.soBuoiKhoa || s.soBuoiDeal, 10) || 12;
    const done = parseInt(s.soBuoiDaHoc, 10) || 0;
    const pct = Math.min(100, Math.round((done / Math.max(total, 1)) * 100));
    const left = s.soBuoiConLai != null ? s.soBuoiConLai : Math.max(0, total - done);

    let alertTag = '';
    let renewAction = '';
    if (left <= 0) {
      alertTag = '<span class="badge-danger-pulse">🚨 Hết buổi</span>';
      renewAction = '<button class="btn-renew" style="padding:4px 10px;font-size:11.5px" onclick="event.stopPropagation();openRenewModal(\'' + s.id + '\')">⚡ Gia hạn</button>';
    } else if (left === 1) {
      alertTag = '<span class="badge-warning-pulse">⚠️ Còn 1 buổi</span>';
      renewAction = '<button class="btn-renew" style="padding:4px 10px;font-size:11.5px" onclick="event.stopPropagation();openRenewModal(\'' + s.id + '\')">⚡ Gia hạn</button>';
    }

    const driveBtn = s.linkDrive && s.linkDrive.indexOf('http') === 0
      ? '<a href="' + esc(s.linkDrive) + '" target="_blank" onclick="event.stopPropagation()" class="btn sm ghost" style="padding:3px 8px;font-size:11px">📁 Drive</a>'
      : '';

    const deleteBtnHtml = canDelete
      ? '<button class="btn sm ghost danger" title="Xoá học viên" onclick="event.stopPropagation();deleteSingleStudent(\'' + s.id + '\',\'' + esc(s.hoTen) + '\')">🗑 Xoá</button>'
      : '';

    return '<div class="st-card" style="position:relative" onclick="openStudentProfile(\'' + s.id + '\')">' +
      '<div class="st-card-chk-wrap">' +
        '<input type="checkbox" class="st-chk" value="' + s.id + '" onchange="updateSelectedStudentCount()" onclick="event.stopPropagation()">' +
      '</div>' +
      '<div>' +
        '<div class="st-card-header" style="padding-left:24px">' +
          '<div class="st-avatar-wrap">' +
            getAvatarHtml(s) +
            '<span class="badge rk-' + rk + ' st-rank-badge-floated">Rank ' + rk + '</span>' +
          '</div>' +
          '<div class="st-card-info">' +
            '<h3>' + esc(s.hoTen) + '</h3>' +
            '<p>' + esc(s.loaiGiong || 'Chưa chọn giọng') + ' · Lớp <b>' + esc(s.lop || '—') + '</b></p>' +
            '<div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + 
              stBadge(s.tinhTrang) + 
              alertTag +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="st-progress-box">' +
          '<div class="st-prog-header">' +
            '<span>Tiến độ: <b>' + done + '/' + total + ' buổi</b></span>' +
            (left <= 1 ? (left <= 0 ? '<b style="color:var(--danger)">Hết buổi</b>' : '<b style="color:var(--warn)">Còn đúng 1 buổi</b>') : '<span style="color:var(--gold)">Còn ' + left + ' buổi</span>') +
          '</div>' +
          '<div class="st-prog-bar"><div class="st-prog-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +

        '<div class="st-tags">' +
          (s.quangGiong ? '<span class="st-tag">🎙 ' + esc(s.quangGiong) + '</span>' : '') +
          (s.noteChuyenGiong ? '<span class="st-tag">⚡ ' + esc(s.noteChuyenGiong) + '</span>' : '') +
          '<span class="st-tag">👨‍🏫 GV ' + esc(s.giaoVien || 'Linh') + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="st-card-actions">' +

// ==================== THAO TÁC XOÁ & CHỌN HÀNG LOẠT HỌC VIÊN ====================
function updateSelectedStudentCount() {
  const checkedChks = document.querySelectorAll('.st-chk:checked:not(#chkAllStudents):not(#chkAllStudentsTable)');
  const count = checkedChks.length;

  // Cập nhật giao diện thẻ / lưới / bảng tương ứng với các mục được chọn
  document.querySelectorAll('.st-card').forEach(function(card){
    const chk = card.querySelector('.st-chk');
    card.classList.toggle('selected', !!(chk && chk.checked));
  });
  document.querySelectorAll('.st-grid-item').forEach(function(item){
    const chk = item.querySelector('.st-chk');
    item.classList.toggle('selected', !!(chk && chk.checked));
  });
  document.querySelectorAll('#stBody tr').forEach(function(row){
    const chk = row.querySelector('.st-chk');
    row.classList.toggle('st-row-selected', !!(chk && chk.checked));
  });

  // Hiển thị / ẩn thanh Batch Action Bar
  const batchBar = $('stBatchBar');
  const badge = $('stSelectedCountBadge');
  const btnDeleteBatch = $('btnDeleteSelectedStudents');
  const canDelete = hasPerm('students', 'delete');

  if (batchBar) {
    batchBar.style.display = count > 0 ? 'flex' : 'none';
  }
  if (badge) {
    badge.textContent = 'Đã chọn ' + count + ' học viên';
  }
  if (btnDeleteBatch) {
    btnDeleteBatch.style.display = canDelete ? 'inline-flex' : 'none';
  }

  // Cập nhật trạng thái Checkbox Chọn tất cả (Master Checkboxes)
  const allVisibleChks = document.querySelectorAll('.st-chk:not(#chkAllStudents):not(#chkAllStudentsTable)');
  const allChecked = allVisibleChks.length > 0 && (count === allVisibleChks.length);
  const masterChk1 = $('chkAllStudents');
  const masterChk2 = $('chkAllStudentsTable');
  if (masterChk1) masterChk1.checked = allChecked;
  if (masterChk2) masterChk2.checked = allChecked;
}

function toggleSelectAllStudents(checked) {
  const chks = document.querySelectorAll('.st-chk:not(#chkAllStudents):not(#chkAllStudentsTable)');
  chks.forEach(function(c){ c.checked = checked; });
  const masterChk1 = $('chkAllStudents');
  const masterChk2 = $('chkAllStudentsTable');
  if (masterChk1) masterChk1.checked = checked;
  if (masterChk2) masterChk2.checked = checked;
  updateSelectedStudentCount();
}

function clearSelectedStudents() {
  toggleSelectAllStudents(false);
}

function deleteSingleStudent(id, name) {
  if (!id) { toast('⚠️ Không tìm thấy mã học viên'); return; }
  if (!hasPerm('students', 'delete')) {
    toast('⚠️ Bạn không có quyền xoá học viên');
    return;
  }
  const stName = name || 'này';
  if (!confirm('Bạn có chắc chắn muốn xoá học viên "' + stName + '" không?\n\n⚠️ THAO TÁC KHÔNG THỂ HOÀN TÁC:\n- Toàn bộ hồ sơ học viên sẽ bị xoá.\n- Tất cả lịch sử buổi học, đánh giá giọng và bài hát liên quan sẽ bị xoá vĩnh viễn.')) {
    return;
  }
  executeDeleteStudents([id], false);
}

function deleteSelectedStudents() {
  if (!hasPerm('students', 'delete')) {
    toast('⚠️ Bạn không có quyền xoá học viên');
    return;
  }
  const checkedChks = document.querySelectorAll('.st-chk:checked:not(#chkAllStudents):not(#chkAllStudentsTable)');
  const ids = Array.from(checkedChks).map(function(c){ return c.value; }).filter(Boolean);
  if (!ids.length) {
    toast('⚠️ Chưa chọn học viên nào để xoá');
    return;
  }
  if (!confirm('Bạn có chắc chắn muốn xoá ' + ids.length + ' học viên đã chọn không?\n\n⚠️ THAO TÁC KHÔNG THỂ HOÀN TÁC:\n- Toàn bộ hồ sơ của ' + ids.length + ' học viên sẽ bị xoá.\n- Tất cả lịch sử buổi học, đánh giá giọng và bài hát liên quan sẽ bị xoá vĩnh viễn.')) {
    return;
  }
  executeDeleteStudents(ids, false);
}

function deleteCurrentStudentFromProfile() {
  if (!CUR_STUDENT || !CUR_STUDENT.id) {
    toast('⚠️ Không xác định được học viên hiện tại');
    return;
  }
  if (!hasPerm('students', 'delete')) {
    toast('⚠️ Bạn không có quyền xoá học viên');
    return;
  }
  if (!confirm('Bạn có chắc chắn muốn xoá học viên "' + (CUR_STUDENT.hoTen || '') + '" không?\n\n⚠️ THAO TÁC KHÔNG THỂ HOÀN TÁC:\n- Hồ sơ và toàn bộ dữ liệu học tập của học viên này sẽ bị xoá vĩnh viễn.')) {
    return;
  }
  executeDeleteStudents([CUR_STUDENT.id], true);
}

function executeDeleteStudents(studentIds, isFromProfile) {
  if (!studentIds || !studentIds.length) return;

  const idStrs = studentIds.map(function(id){ return String(id); });
  
  // 1. Optimistic UI update: Gỡ ngay học viên khỏi ALL_STUDENTS
  const backupList = ALL_STUDENTS.slice();
  ALL_STUDENTS = ALL_STUDENTS.filter(function(s){
    return idStrs.indexOf(String(s.id)) === -1;
  });

  // Xoá cache chi tiết
  idStrs.forEach(function(id){
    delete CACHE_STUDENTS_DETAIL[id];
  });

  // Nếu xoá từ Profile -> Quay lại danh sách
  if (isFromProfile) {
    goBackToStudentList();
  } else {
    renderStudents();
  }

  toast('⚡ Đang xoá học viên trên Google Sheets...');

  // Gọi server xoá dữ liệu vĩnh viễn trên Google Sheets
  API_RUN
    .withSuccessHandler(function(res){
      if (res && res.success) {
        const count = res.count !== undefined ? res.count : studentIds.length;
        toast('🎉 Đã xoá thành công ' + count + ' học viên và dữ liệu liên quan!');
        clearSelectedStudents();
        loadDashboard(); // Cập nhật lại các thẻ thống kê Dashboard
      } else {
        // Rollback nếu có lỗi
        ALL_STUDENTS = backupList;
        renderStudents();
        toast('⚠️ Lỗi khi xoá: ' + (res ? res.message : 'Không xác định'));
      }
    })
    .withFailureHandler(function(err){
      // Rollback nếu lỗi kết nối
      ALL_STUDENTS = backupList;
      renderStudents();
      toast('❌ Lỗi hệ thống: ' + (err ? err.message : 'Không thể kết nối máy chủ'));
    })
    .deleteStudents(studentIds);
}

function openStudentProfile(id) {
  // Lấy dữ liệu nhanh
  const fastData = CACHE_STUDENTS_DETAIL[id] || ALL_STUDENTS.find(function(x){ return String(x.id) === String(id); });
  if (!fastData) { toast('Không tìm thấy học viên'); return; }

  CUR_STUDENT = fastData;
  displayStudentProfileView(CUR_STUDENT);

  // Ẩn tất cả view khác, hiện view-student-profile
  $('view-dashboard').style.display       = 'none';
  $('view-students').style.display        = 'none';
  $('view-settings').style.display        = 'none';
  $('view-tuition').style.display         = 'none';
  $('view-schedule').style.display        = 'none';
  document.body.classList.remove('view-schedule');
  $('view-classroom-flow').style.display  = 'none';
  $('view-student-profile').style.display = 'block';
  window.scrollTo(0,0);

  // Gọi server nạp chi tiết ngầm
  API_RUN.withSuccessHandler(function(fullData){
    if (fullData) {
      CACHE_STUDENTS_DETAIL[id] = fullData;
      if (CUR_STUDENT && String(CUR_STUDENT.id) === String(id)) {
        CUR_STUDENT = fullData;
        displayStudentProfileView(CUR_STUDENT);
      }
    }
  }).getStudent(id);
}

  $('view-student-profile').style.display = 'none';

  $('view-students').style.display        = 'block';
  $('mainSidebar').style.display          = 'flex';

}

let EDITING_SESSION_ID = null;

function renderProfileSessions(list) {
  const container = $('profSessionList');
  const chkAll = $('chkSelectAllSessions');
  if (chkAll) { chkAll.checked = false; }
  updateSelectedSessionCount();

  if (!list || !list.length) { 
    container.innerHTML = '<div class="empty">Chưa có buổi học nào được ghi nhận.</div>'; 
    if ($('lblSelectAllSessions')) $('lblSelectAllSessions').style.display = 'none';
    return; 
  }
  if ($('lblSelectAllSessions')) $('lblSelectAllSessions').style.display = 'inline-flex';

  const driveLink = (CUR_STUDENT && CUR_STUDENT.linkDrive && CUR_STUDENT.linkDrive.indexOf('http') === 0) ? CUR_STUDENT.linkDrive : '';

  container.innerHTML = list.slice().reverse().map(function(b){
    // Xử lý danh sách bài hát
    let songsList = [];
    if (b.songsJson) {
      try {
        const parsed = typeof b.songsJson === 'string' ? JSON.parse(b.songsJson) : b.songsJson;
        if (Array.isArray(parsed) && parsed.length > 0) songsList = parsed;
      } catch(e) {}
    }
    if (!songsList.length && b.baiHat) {
      songsList = [{
        title: b.baiHat,
        ytLink: b.linkYoutube || ((b.baiHat.indexOf('http') === 0) ? b.baiHat : ''),
        noteCao: b.noteCao || '',
        noteThap: b.noteThap || '',
        details: b.noiDung || ''
      }];
    }

    let songsHtml = '';
    if (songsList.length > 0) {
      songsHtml = songsList.filter(function(s){ return s.title || s.ytLink; }).map(function(s, idx){
        let sYtBtn = '';
        if (s.ytLink && s.ytLink.indexOf('http') === 0) {
          sYtBtn = '<a href="' + esc(s.ytLink) + '" target="_blank" onclick="event.stopPropagation()" class="yt-pill-btn sm">▶ Xem YouTube</a>';
        }
        return '<div style="font-size:13.5px;font-weight:600;margin:4px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +

function updateSelectedSessionCount() {

function deleteSingleSession(sessionId, buoiSo) {
  if (!sessionId) {
    toast('⚠️ Không tìm thấy mã buổi học để xoá');
    return;
  }
  const label = buoiSo ? ('Buổi ' + buoiSo) : sessionId;
  if (!confirm('Bạn có chắc chắn muốn xoá lịch sử ' + label + ' không?\n(Dữ liệu buổi học và số buổi đã học sẽ được cập nhật lại)')) {
    return;
  }
  executeDeleteSessions([sessionId]);
}

function deleteSelectedSessions() {
  const checked = document.querySelectorAll('.sess-chk:checked');
  const ids = Array.from(checked).map(function(c){ return c.value; }).filter(Boolean);
  if (!ids.length) {
    toast('⚠️ Chưa chọn buổi học nào để xoá');
    return;
  }
  if (!confirm('Bạn có chắc chắn muốn xoá ' + ids.length + ' buổi học đã chọn không?')) {
    return;
  }
  executeDeleteSessions(ids);
}

function executeDeleteSessions(sessionIds) {
  if (!CUR_STUDENT || !CUR_STUDENT.id) {
    toast('⚠️ Không xác định được học viên');
    return;
  }

  // 1. Optimistic UI update: Gỡ ngay lập tức các buổi học trên giao diện (Tốc độ tức thì)
  const idStrs = sessionIds.map(function(id){ return String(id); });
  const backupSessions = CUR_STUDENT.buoiHoc ? CUR_STUDENT.buoiHoc.slice() : [];
  CUR_STUDENT.buoiHoc = backupSessions.filter(function(b){
    return idStrs.indexOf(String(b.id)) === -1;
  });
  
  // Render lại ngay các tab
  renderProfileSessions(CUR_STUDENT.buoiHoc);
  renderProfileExercises(CUR_STUDENT.buoiHoc);
  renderProfileSongs(CUR_STUDENT.phanTichBai || []);
  
  // Cập nhật ngay các thẻ số buổi
  const total = parseInt(CUR_STUDENT.soBuoiKhoa || CUR_STUDENT.soBuoiDeal, 10) || 0;
  const done = CUR_STUDENT.buoiHoc.length;
  const left = Math.max(0, total - done);
  if ($('p_dahoc')) $('p_dahoc').textContent = done + ' buổi';
  if ($('p_conlai_num')) $('p_conlai_num').textContent = left + ' buổi';
  if ($('pq_conlai')) $('pq_conlai').textContent = left + ' buổi';

  toast('⚡ Đang tự động xoá trên Google Sheets...');

  API_RUN
    .withSuccessHandler(function(res){
      if (res && res.success) {
        toast('🎉 Đã xoá sạch hàng trên Google Sheets (' + (res.count !== undefined ? res.count : sessionIds.length) + ' buổi)!');
        delete CACHE_STUDENTS_DETAIL[CUR_STUDENT.id];
        loadStudents();
      } else {
        // Rollback nếu thất bại
        CUR_STUDENT.buoiHoc = backupSessions;
        renderProfileSessions(CUR_STUDENT.buoiHoc);
        renderProfileExercises(CUR_STUDENT.buoiHoc);
        toast('⚠️ Lỗi khi xoá: ' + (res ? res.message : 'Không xác định'));
      }
    })
    .withFailureHandler(function(err){
      CUR_STUDENT.buoiHoc = backupSessions;
      renderProfileSessions(CUR_STUDENT.buoiHoc);
      renderProfileExercises(CUR_STUDENT.buoiHoc);
      toast('❌ Lỗi hệ thống: ' + (err ? err.message : 'Không thể kết nối máy chủ'));
    })
    .deleteSessions(sessionIds, CUR_STUDENT.id);
}

// ==================== DYNAMIC MULTI-SONG MANAGEMENT & PER-SONG GUIDES ====================
let STUDIO_SONGS = [];
let ACTIVE_SONG_GUIDE_INDEX = 0;
let CURRENT_SONG_SECTIONS = [];

function getDefaultSongStructure() {
  return [
    { id: 'sec_1', title: 'Ver 1', badge: 'badge-ver', text: '' },
    { id: 'sec_2', title: 'Ver 2', badge: 'badge-ver', text: '' },
    { id: 'sec_3', title: 'Chorus', badge: 'badge-chorus', text: '' },
    { id: 'sec_4', title: 'Giang tấu', badge: 'badge-interlude', text: '' },
    { id: 'sec_5', title: 'Ver 2', badge: 'badge-ver', text: '' },
    { id: 'sec_6', title: 'Chorus', badge: 'badge-chorus', text: '' },
    { id: 'sec_7', title: 'Chorus', badge: 'badge-chorus-climax', text: '' },
    { id: 'sec_8', title: '2 câu cuối Chorus', badge: 'badge-ending', text: '' }
  ];
}

function getStudentRangeInfo() {
  if (!CUR_STUDENT) return { low: '—', high: '—', text: 'Chưa có thông tin' };
  let low = CUR_STUDENT.noteThap || '';
  let high = CUR_STUDENT.noteCao || '';
  if (!low && CUR_STUDENT.chestVoice) {
    const parts = String(CUR_STUDENT.chestVoice).split(/[-–—]/);
    if (parts[0]) low = parts[0].trim();
  }
  if (!high && (CUR_STUDENT.whistleVoice || CUR_STUDENT.headVoice || CUR_STUDENT.mixVoice)) {
    const src = (CUR_STUDENT.whistleVoice && CUR_STUDENT.whistleVoice !== '—') ? CUR_STUDENT.whistleVoice
      : ((CUR_STUDENT.headVoice && CUR_STUDENT.headVoice !== '—') ? CUR_STUDENT.headVoice : CUR_STUDENT.mixVoice);
    const parts = String(src).split(/[-–—]/);
    if (parts.length > 1) high = parts[parts.length - 1].trim();
  }
  if (!low && CUR_STUDENT.quangGiong) {
    const parts = String(CUR_STUDENT.quangGiong).split(/[-–—]/);
    if (parts[0]) low = parts[0].trim();
    if (parts.length > 1) high = parts[parts.length - 1].trim();
  }
  low = low || '—';
  high = high || '—';
  const text = (low !== '—' && high !== '—') ? (low + ' – ' + high) : (CUR_STUDENT.quangGiong || '—');
  return { low: low, high: high, text: text };
}

function syncActiveSongGuideFromDom() {
  const guideItems = document.querySelectorAll('#cf_songGuideBuilder .guide-sec-item');
  guideItems.forEach(function(item, idx){
    if (CURRENT_SONG_SECTIONS[idx]) {
      const ta = item.querySelector('textarea');
      if (ta) CURRENT_SONG_SECTIONS[idx].text = ta.value;
    }
  });
  if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
    STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = JSON.parse(JSON.stringify(CURRENT_SONG_SECTIONS));
  }
}

function switchActiveSongGuide(targetIdx) {
  if (targetIdx < 0 || targetIdx >= STUDIO_SONGS.length) return;
  syncActiveSongGuideFromDom();
  ACTIVE_SONG_GUIDE_INDEX = targetIdx;
  if (!STUDIO_SONGS[targetIdx].guideSections || !Array.isArray(STUDIO_SONGS[targetIdx].guideSections) || !STUDIO_SONGS[targetIdx].guideSections.length) {
    STUDIO_SONGS[targetIdx].guideSections = getDefaultSongStructure();
  }
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[targetIdx].guideSections;
  renderSongGuideTabs();
  renderSongGuideBuilder();
  renderStudioSongsList();
}

function renderSongGuideTabs() {
  const container = $('cf_songGuideTabsContainer');
  if (!container) return;
  if (!STUDIO_SONGS.length) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = STUDIO_SONGS.map(function(s, idx){
    const isActive = (idx === ACTIVE_SONG_GUIDE_INDEX);
    const title = s.title && s.title.trim() ? s.title.trim() : ('Bài ' + (idx + 1));
    return '<button type="button" class="btn-song-tab ' + (isActive ? 'active' : '') + '" onclick="switchActiveSongGuide(' + idx + ')">' +

}

function addStudioSongItem(data) {
  syncActiveSongGuideFromDom();

  const s = data || {
    id: 'song_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    title: '',
    ytLink: '',
    noteCao: '',
    noteThap: '',
    tone: '0',
    details: '',
    guideSections: getDefaultSongStructure()
  };
  if (!s.guideSections || !Array.isArray(s.guideSections) || !s.guideSections.length) {
    s.guideSections = getDefaultSongStructure();
  }
  if (s.tone === undefined) s.tone = '0';

  STUDIO_SONGS.push(s);
  ACTIVE_SONG_GUIDE_INDEX = STUDIO_SONGS.length - 1;
  CURRENT_SONG_SECTIONS = s.guideSections;

  renderStudioSongsList();
  renderSongGuideTabs();
  renderSongGuideBuilder();
}

function removeStudioSongItem(idx) {
  if (STUDIO_SONGS.length <= 1) {
    STUDIO_SONGS[0] = {
      id: 'song_' + Date.now(),
      title: '',
      ytLink: '',
      noteCao: '',
      noteThap: '',
      tone: '0',
      details: '',
      guideSections: getDefaultSongStructure()
    };
    ACTIVE_SONG_GUIDE_INDEX = 0;
    CURRENT_SONG_SECTIONS = STUDIO_SONGS[0].guideSections;
    renderStudioSongsList();
    renderSongGuideTabs();
    renderSongGuideBuilder();
    return;
  }
  STUDIO_SONGS.splice(idx, 1);
  if (ACTIVE_SONG_GUIDE_INDEX >= STUDIO_SONGS.length) {
    ACTIVE_SONG_GUIDE_INDEX = STUDIO_SONGS.length - 1;
  }
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections || getDefaultSongStructure();

  renderSongGuideTabs();
  renderSongGuideBuilder();
}

function updateStudioSongField(idx, field, val) {
  if (STUDIO_SONGS[idx]) {

  }
}

function quickShiftTone(idx, delta) {
  if (!STUDIO_SONGS[idx]) return;
  let cur = parseFloat(STUDIO_SONGS[idx].tone) || 0;
  if (delta === 0) cur = 0;
  else cur += delta;
  let valStr = cur === 0 ? '0' : (cur > 0 ? ('+' + cur) : String(cur));
  STUDIO_SONGS[idx].tone = valStr;
  renderStudioSongsList();
}

// ==================== SONG GUIDE BUILDER (DRAG & DROP + CẤU TRÚC CHUẨN 8 ĐOẠN) ====================
let DRAG_SRC_INDEX = null;

function resetDefaultSongStructure() {
  CURRENT_SONG_SECTIONS = getDefaultSongStructure();
  if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
    STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = JSON.parse(JSON.stringify(CURRENT_SONG_SECTIONS));
  }
  renderSongGuideBuilder();
}

function insertSongSection(title, badge, text) {
  const newSec = {
    id: 'sec_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    title: title,
    badge: badge || 'badge-custom',
    text: text || ''
  };
  CURRENT_SONG_SECTIONS.push(newSec);
  if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
    STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
  }
  renderSongGuideBuilder();
}

function promptAddCustomSection() {
  const name = prompt('Nhập tên đoạn cần thêm (VD: Intro, Hook, Drop, Solo, Điệp khúc cao trào...):', 'Intro');
  if (name && name.trim()) {
    insertSongSection(name.trim(), 'badge-custom', '');
  }
}

function removeSongSection(idx) {
  if (idx >= 0 && idx < CURRENT_SONG_SECTIONS.length) {
    CURRENT_SONG_SECTIONS.splice(idx, 1);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function duplicateSection(idx) {
  if (CURRENT_SONG_SECTIONS[idx]) {
    const src = CURRENT_SONG_SECTIONS[idx];
    const copy = {
      id: 'sec_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      title: src.title,
      badge: src.badge,
      text: src.text
    };
    CURRENT_SONG_SECTIONS.splice(idx + 1, 0, copy);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function moveSectionUp(idx) {
  if (idx > 0) {
    const item = CURRENT_SONG_SECTIONS.splice(idx, 1)[0];
    CURRENT_SONG_SECTIONS.splice(idx - 1, 0, item);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function moveSectionDown(idx) {
  if (idx < CURRENT_SONG_SECTIONS.length - 1) {
    const item = CURRENT_SONG_SECTIONS.splice(idx, 1)[0];
    CURRENT_SONG_SECTIONS.splice(idx + 1, 0, item);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
}

function clearAllSongSections() {
  if (!CURRENT_SONG_SECTIONS.length) return;
  const curSong = STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX];
  const songName = curSong && curSong.title ? (' của bài "' + curSong.title + '"') : '';
  if (confirm('Bạn có chắc muốn xoá tất cả các đoạn hướng dẫn' + songName + '?')) {
    CURRENT_SONG_SECTIONS = [];
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = [];
    }
    renderSongGuideBuilder();
  }
}

function updateSectionText(idx, val) {
  if (CURRENT_SONG_SECTIONS[idx]) {
    CURRENT_SONG_SECTIONS[idx].text = val;
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX] && STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections) {
      if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections[idx]) {
        STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections[idx].text = val;
      }
    }
  }
}

// HTML5 Drag and Drop handlers
function handleSectionDragStart(e, idx) {
  DRAG_SRC_INDEX = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', idx);
  e.currentTarget.classList.add('dragging');
}

function handleSectionDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  if (!el.classList.contains('drag-over')) {
    el.classList.add('drag-over');
  }
}

function handleSectionDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function handleSectionDrop(e, targetIdx) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if (DRAG_SRC_INDEX !== null && DRAG_SRC_INDEX !== targetIdx) {
    const movedItem = CURRENT_SONG_SECTIONS.splice(DRAG_SRC_INDEX, 1)[0];
    CURRENT_SONG_SECTIONS.splice(targetIdx, 0, movedItem);
    if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
      STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
    }
    renderSongGuideBuilder();
  }
  DRAG_SRC_INDEX = null;
}

function handleSectionDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.guide-sec-item').forEach(function(el){
    el.classList.remove('drag-over');
    el.classList.remove('dragging');
  });
  DRAG_SRC_INDEX = null;
}

function renderSongGuideBuilder() {
  const container = $('cf_songGuideBuilder');
  if (!container) return;
  if (!CURRENT_SONG_SECTIONS || !CURRENT_SONG_SECTIONS.length) {
    container.innerHTML = '<div style="color:var(--mut);font-size:12px;padding:14px;text-align:center;background:#080e0a;border:1px dashed var(--line);border-radius:10px">Bài hát này chưa có đoạn hướng dẫn nào. Bấm nút <b>"🎯 Cấu trúc chuẩn"</b> hoặc các nút chèn nhanh bên dưới.</div>';
    return;
  }

  container.innerHTML = CURRENT_SONG_SECTIONS.map(function(sec, idx){
    return '<div class="guide-sec-item" draggable="true" ' +
      'ondragstart="handleSectionDragStart(event, ' + idx + ')" ' +
      'ondragover="handleSectionDragOver(event, ' + idx + ')" ' +
      'ondragleave="handleSectionDragLeave(event)" ' +
      'ondrop="handleSectionDrop(event, ' + idx + ')" ' +
      'ondragend="handleSectionDragEnd(event)">' +
      '<div class="guide-sec-head">' +
        '<div class="guide-sec-title-wrap">' +
          '<span class="drag-handle" title="Giữ chuột và kéo để đổi thứ tự">⠿</span>' +
          '<span class="guide-badge ' + (sec.badge || 'badge-custom') + '">' + esc(sec.title) + '</span>' +
          '<small style="color:var(--mut);font-size:11px">#' + (idx + 1) + '</small>' +
        '</div>' +
        '<div class="guide-actions">' +
          (idx > 0 ? '<button type="button" class="btn-guide-act" onclick="moveSectionUp(' + idx + ')" title="Di chuyển lên">▲</button>' : '') +
          (idx < CURRENT_SONG_SECTIONS.length - 1 ? '<button type="button" class="btn-guide-act" onclick="moveSectionDown(' + idx + ')" title="Di chuyển xuống">▼</button>' : '') +
          '<button type="button" class="btn-guide-act" onclick="duplicateSection(' + idx + ')" title="Nhân bản đoạn này">📋</button>' +
          '<button type="button" class="btn-guide-act" style="color:var(--danger)" onclick="removeSongSection(' + idx + ')" title="Xoá đoạn này">✕</button>' +
        '</div>' +
      '</div>' +
      '<textarea class="guide-sec-textarea" placeholder="Điền hướng dẫn hát cho đoạn ' + esc(sec.title) + ' (cách lấy hơi, nốt chuyển, cảm xúc, dynamic...)" oninput="updateSectionText(' + idx + ', this.value)">' + esc(sec.text || '') + '</textarea>' +
    '</div>';
  }).join('');
}

function getSongGuideJson() {
  syncActiveSongGuideFromDom();
  return JSON.stringify(CURRENT_SONG_SECTIONS);
}

function loadSongGuideFromJson(jsonOrStr) {
  if (!jsonOrStr) {
    resetDefaultSongStructure();
    return;
  }
  try {
    if (typeof jsonOrStr === 'string' && jsonOrStr.trim().startsWith('[')) {
      CURRENT_SONG_SECTIONS = JSON.parse(jsonOrStr);
    } else if (typeof jsonOrStr === 'string' && jsonOrStr.trim().length > 0) {
      CURRENT_SONG_SECTIONS = [
        { id: 'sec_leg_1', title: 'Hướng dẫn tổng quan', badge: 'badge-custom', text: jsonOrStr }
      ];
    } else if (Array.isArray(jsonOrStr)) {
      CURRENT_SONG_SECTIONS = jsonOrStr;
    } else {
      resetDefaultSongStructure();
    }
  } catch(e) {
    resetDefaultSongStructure();
  }
  if (STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX]) {
    STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX].guideSections = CURRENT_SONG_SECTIONS;
  }
  renderSongGuideBuilder();
}

function aiFillSongGuide() {
  syncActiveSongGuideFromDom();
  const curSong = STUDIO_SONGS[ACTIVE_SONG_GUIDE_INDEX] || STUDIO_SONGS[0] || {};
  let target = curSong.ytLink || curSong.title;
  if (!target) {
    target = prompt('Nhập tên bài hát hoặc link YouTube để AI gợi ý hướng dẫn:', '');
  }
  if (!target || !target.trim()) {
    toast('⚠️ Vui lòng nhập Tên bài hát hoặc link YouTube trước');
    return;
  }

  toast('✨ AI đang phân tích cấu trúc bài hát ' + (curSong.title ? ('"' + curSong.title + '"') : '') + '...');
  API_RUN.withSuccessHandler(function(res){
    if (res) {
      toast('✅ Đã phân tích xong gợi ý bài hát!');
      insertSongSection('Gợi ý xử lý AI', 'badge-chorus', res);
    }
  }).aiAnalyzeSong({
    linkYoutube: target.trim(),
    quangGiong: CUR_STUDENT ? CUR_STUDENT.quangGiong : ''
  });
}

// ĐỒNG BỘ DỮ LIỆU TỪ FORM TRƯỚC KHI LƯU
function syncStudioSongsAndTechsFromDom() {
  const songCards = document.querySelectorAll('#cf_songsListContainer .studio-sub-card');
  songCards.forEach(function(card, idx){
    if (!STUDIO_SONGS[idx]) {
      STUDIO_SONGS[idx] = { id: 'song_' + idx, title: '', ytLink: '', noteCao: '', noteThap: '', tone: '0', details: '', guideSections: getDefaultSongStructure() };
    }
    const textInputs = card.querySelectorAll('input');
    const select = card.querySelector('select.tone-select');
    if (textInputs.length >= 1) STUDIO_SONGS[idx].title   = textInputs[0].value;
    if (textInputs.length >= 2) STUDIO_SONGS[idx].ytLink  = textInputs[1].value;
    if (textInputs.length >= 3) STUDIO_SONGS[idx].noteCao = textInputs[2].value;
    if (textInputs.length >= 4) STUDIO_SONGS[idx].noteThap= textInputs[3].value;
    if (select) STUDIO_SONGS[idx].tone = select.value;
    if (textInputs.length >= 5) STUDIO_SONGS[idx].details = textInputs[4].value;
  });

  const techCards = document.querySelectorAll('#cf_techListContainer .studio-sub-card');
  techCards.forEach(function(card, idx){
    if (!STUDIO_TECHS[idx]) {
      STUDIO_TECHS[idx] = { id: 'tech_' + idx, name: '', ytLink: '', notes: '' };
    }
    const inputs = card.querySelectorAll('input');
    if (inputs.length >= 1) STUDIO_TECHS[idx].name  = inputs[0].value;
    if (inputs.length >= 2) STUDIO_TECHS[idx].ytLink = inputs[1].value;
    if (inputs.length >= 3) STUDIO_TECHS[idx].notes = inputs[2].value;
  });

  syncActiveSongGuideFromDom();
}

function openPastSessionInStudio(sessionId) {
  if (!CUR_STUDENT) return;

  const b = list.find(function(x){ return String(x.id) === String(sessionId); }) || list[list.length - 1];

  document.body.style.paddingLeft         = '0';
  $('view-student-profile').style.display = 'none';
  $('view-classroom-flow').style.display  = 'block';

  // Restore songs
  if (b.songsJson) {
    try {
      STUDIO_SONGS = typeof b.songsJson === 'string' ? JSON.parse(b.songsJson) : b.songsJson;
    } catch(e) {
      STUDIO_SONGS = [];
    }
  } else {
    STUDIO_SONGS = [];
  }
  if (!Array.isArray(STUDIO_SONGS) || !STUDIO_SONGS.length) {
    STUDIO_SONGS = [{
      id: 'song_1',
      title: (b.baiHat && b.baiHat.indexOf('http') === 0) ? 'Bài hát thực hành' : (b.baiHat || ''),
      ytLink: b.linkYoutube || ((b.baiHat && b.baiHat.indexOf('http') === 0) ? b.baiHat : ''),
      noteCao: b.noteCao || '',
      noteThap: b.noteThap || '',
      tone: '0',
      details: b.noiDung || '',
      guideSections: getDefaultSongStructure()
    }];
    if (b.huongDanHatJson) {
      try {
        if (typeof b.huongDanHatJson === 'string' && b.huongDanHatJson.trim().startsWith('[')) {
          STUDIO_SONGS[0].guideSections = JSON.parse(b.huongDanHatJson);
        }
      } catch(e) {}
    }
  } else {
    STUDIO_SONGS.forEach(function(s, sIdx){
      if (!s.guideSections || !Array.isArray(s.guideSections) || !s.guideSections.length) {
        if (sIdx === 0 && b.huongDanHatJson) {
          try {
            if (typeof b.huongDanHatJson === 'string' && b.huongDanHatJson.trim().startsWith('[')) {
              s.guideSections = JSON.parse(b.huongDanHatJson);
            } else {
              s.guideSections = getDefaultSongStructure();
            }
          } catch(e) {
            s.guideSections = getDefaultSongStructure();
          }
        } else {
          s.guideSections = getDefaultSongStructure();
        }
      }
      if (s.tone === undefined) s.tone = '0';
    });
    if (!STUDIO_SONGS[0].ytLink && b.linkYoutube) {
      STUDIO_SONGS[0].ytLink = b.linkYoutube;
    }
  }
  ACTIVE_SONG_GUIDE_INDEX = 0;
  CURRENT_SONG_SECTIONS = STUDIO_SONGS[0].guideSections;
  renderStudioSongsList();
  renderSongGuideTabs();
  renderSongGuideBuilder();

  // Restore techs
  if (b.techsJson) {
    try {
      STUDIO_TECHS = typeof b.techsJson === 'string' ? JSON.parse(b.techsJson) : b.techsJson;
    } catch(e) {
      STUDIO_TECHS = [];
    }
  } else {
    STUDIO_TECHS = [];
  }
  if (!Array.isArray(STUDIO_TECHS)) {
    STUDIO_TECHS = [];
  }
  if (!STUDIO_TECHS.length && b.kyThuat) {
    STUDIO_TECHS = [{
      id: 'tech_1',
      name: b.kyThuat.replace(/^•\s*/, ''),
      ytLink: b.linkYoutubeKyThuat || '',
      notes: ''
    }];
  } else if (STUDIO_TECHS.length) {
    if (!STUDIO_TECHS[0].ytLink && b.linkYoutubeKyThuat) {
      STUDIO_TECHS[0].ytLink = b.linkYoutubeKyThuat;
    }
  }
  renderStudioTechList();

  if ($('cf_btvn')) $('cf_btvn').value        = b.baiTapVeNha || '';
  if ($('cf_nhanXet')) $('cf_nhanXet').value     = b.nhanXet || '';
  if ($('cf_ghiChuNoiBo')) $('cf_ghiChuNoiBo').value = b.ghiChuNoiBo || '';
  
  if (typeof setSessionScore === 'function') setSessionScore(b.diemSo ? parseInt(b.diemSo, 10) : 8);

  toast('✅ Đã nạp lại dữ liệu Buổi ' + (b.buoiSo || ''));
  window.scrollTo(0,0);
}

    : ((CUR_STUDENT.buoiHoc ? CUR_STUDENT.buoiHoc.length : 0) + 1);

  const primarySong = STUDIO_SONGS[0] || {};

  }).filter(Boolean).join('\n');

  const techNames = STUDIO_TECHS.map(function(t){
    return t.name + (t.notes ? (' (' + t.notes + ')') : '');

  const techYt = primaryTech.ytLink || (STUDIO_TECHS.find(function(t){ return t.ytLink; }) || {}).ytLink || '';

    ghiChuNoiBo:        $('cf_ghiChuNoiBo') ? $('cf_ghiChuNoiBo').value : '',
    diemSo:             typeof STUDIO_SESSION_SCORE !== 'undefined' ? STUDIO_SESSION_SCORE : 8,
    songsJson:          JSON.stringify(STUDIO_SONGS),
    techsJson:          JSON.stringify(STUDIO_TECHS)
  };

    toast('🎉 Đã lưu Buổi ' + nextBuoi + ' thành công!');

      document.body.style.paddingLeft       = '0';
    }

  }).saveSession(data);

function recalcSessionCounts() {
  const khoa = parseInt($('f_soBuoiKhoa').value, 10) || 0;
  const daHoc = parseInt($('f_soBuoiDaHoc').value, 10) || 0;
  const conLai = Math.max(0, khoa - daHoc);
  $('f_soBuoiConLai').value = conLai;

  const alertBox = $('formSessionAlertBox');
  if (alertBox) {
    if (khoa > 0 && conLai <= 0) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = 
        '<div style="background:#261210;border:1px solid var(--danger);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<span style="color:#ffb4ab;font-size:12px">🚨 <b>Học viên đã học hết buổi!</b> (Đã học: ' + daHoc + '/' + khoa + ' buổi)</span>' +
          '<button type="button" class="btn sm gold" style="padding:3px 10px;font-size:11.5px" onclick="quickAddSessionsToModal(12)">+ Nạp 12 buổi</button>' +
        '</div>';
    } else if (khoa > 0 && conLai === 1) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = 
        '<div style="background:#261d08;border:1px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<span style="color:#ffe082;font-size:12px">⚠️ <b>Cảnh báo:</b> Học viên chỉ còn đúng <b>1 buổi học</b>!</span>' +
          '<button type="button" class="btn sm gold" style="padding:3px 10px;font-size:11.5px" onclick="quickAddSessionsToModal(12)">+ Nạp 12 buổi</button>' +
        '</div>';
    } else {
      alertBox.style.display = 'none';
      alertBox.innerHTML = '';
    }
  }
}

  $('f_hoTen').value           = d.hoTen || '';
  $('f_namSinh').value         = d.namSinh || '';

  $('rn_studentMeta').textContent = 'Lớp ' + (s.lop || '—') + ' · Rank ' + (s.rank || 'A') + ' · GV ' + (s.giaoVien || 'Linh');

  const total = parseInt(s.soBuoiKhoa || s.soBuoiDeal, 10) || 0;
  const done  = parseInt(s.soBuoiDaHoc, 10) || 0;
  const left  = s.soBuoiConLai != null ? s.soBuoiConLai : Math.max(0, total - done);

  $('rn_curTotal').textContent = total;
  $('rn_curDone').textContent  = done;

function selectRenewPreset(extra) {
  document.querySelectorAll('.renew-preset-btn').forEach(function(btn){
    if (btn.textContent.indexOf('+' + extra + ' buổi') !== -1) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  $('rn_extraSessions').value = extra;
  calcRenewPreview();
}

function calcRenewPreview() {
  const extra = parseInt($('rn_extraSessions').value, 10) || 0;
  const curTotal = parseInt($('rn_curTotal').textContent, 10) || 0;
  const curDone = parseInt($('rn_curDone').textContent, 10) || 0;
  const newTotal = curTotal + extra;
  const newLeft = Math.max(0, newTotal - curDone);
  $('rn_newTotal').value = newTotal;
  $('rn_newLeft').textContent = newLeft + ' buổi';
}

// ==================== TEST RANK & ĐÁNH GIÁ GIỌNG AI ====================
const CRITERIA = [
  { g:'CAO ĐỘ (Pitch)', items:[['P1','Nghe & lặp đúng 1 nốt đơn'],['P2','Hát đúng scale đi lên'],['P3','Hát đúng scale đi xuống'],['P4','Pitch ổn định trong câu (>80%)'],['P5','Giữ đúng cao độ cuối câu']] },
  { g:'NHỊP (Rhythm)', items:[['R1','Vỗ tay đúng metronome'],['R2','Vào nhạc không sớm/trễ']] },
  { g:'HƠI THỞ (Breath)', items:[['B1','Lấy hơi cơ hoành, không nhấc vai'],['B2','Không hụt hơi giữa câu'],['B3','Sustain âm > 8 giây']] },
  { g:'CHẤT GIỌNG (Tone)', items:[['T1','Âm không bí/nghẹt mũi'],['T2','Không gằn cổ, không căng hàm'],['T3','Có độ vang tự nhiên']] },
  { g:'QUÃNG (Range)', items:[['RG1','Không strain vùng cao']] },
  { g:'PHÁT ÂM', items:[['A1','Phát âm rõ, không nuốt chữ']] },
  { g:'CẢM XÚC & TỰ TIN', items:[['M1','Thể hiện cảm xúc cơ bản'],['M2','Tự nhận biết khi hát sai'],['C1','Không run quá mức']] }
];
const critState = {};

function buildCritList(){
  Object.keys(critState).forEach(function(k){ delete critState[k]; });
  $('critList').innerHTML = CRITERIA.map(function(grp){
    return '<div class="crit-grp"><div class="gh">' + grp.g + '</div>' + grp.items.map(function(it){
      critState[it[0]] = 0;
      return '<div class="crit"><div class="cx">[' + it[0] + '] ' + it[1] + '</div><div class="sc">' +
        '<div class="chip on" onclick="setCrit(this,\'' + it[0] + '\',0)">0</div>' +
        '<div class="chip" onclick="setCrit(this,\'' + it[0] + '\',1)">1</div></div></div>';
    }).join('') + '</div>';
  }).join('');
}

function setCrit(el, code, val){
  critState[code] = val;
  const row = el.parentElement;
  row.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
  calcRank();
}

function calcRank(){
  let t = 0;
  Object.keys(critState).forEach(function(k){ t += critState[k]; });
  let r = 'A';
  if (t >= 15) r = 'D';
  else if (t >= 12) r = 'C';
  else if (t >= 7) r = 'B';
  $('v_tong').textContent = t;
  $('v_rank').textContent = r;
  return { t: t, r: r };
}

function critText(){
  return CRITERIA.map(function(grp){
    return grp.items.map(function(it){
      return '[' + it[0] + '] ' + it[1] + ': ' + (critState[it[0]] ? 'Đạt' : 'Chưa đạt');
    }).join('\n');
  }).join('\n');
}

function renderQrPreview_(dataUrl) {
  $('qrPreview').innerHTML = dataUrl ? '<img src="' + dataUrl + '" alt="Mã QR thanh toán">' : '<span>Chưa có ảnh — đang dùng VietQR tự sinh</span>';
  $('btnRemoveQr').hidden = !dataUrl;
}

function loadQrImage() {
  API_RUN.withSuccessHandler(function(res){ renderQrPreview_(res && res.dataUrl); }).getQrImage();
}

function handleQrFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // Giữ ảnh sắc nét (PNG), chỉ thu nhỏ nếu cạnh dài hơn 900px
      const max = 900;
      let w = img.width, h = img.height;
      if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = cv.toDataURL('image/png');
      toast('⏳ Đang tải ảnh QR lên...');
      API_RUN.withSuccessHandler(function(res){
        toast('✅ ' + res.message);
        renderQrPreview_(dataUrl);
      }).uploadQrImage(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeQrImage() {
  if (!confirm('Xoá ảnh QR đã tải lên và quay về mã VietQR tự sinh?')) return;
  API_RUN.withSuccessHandler(function(res){ toast('✅ ' + res.message); renderQrPreview_(''); }).removeQrImage();
